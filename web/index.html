<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escriba</title>
<!--
  ONE FILE, NO BUILD STEP, and the reasons are the peer's rather than ours:
  `kbwiki` serves a single static page whose backend is the only SDK client,
  and this mirrors it so two deployments on one box are maintained the same
  way.  Two consequences worth saying out loud:

  PLAIN DOM, NOT A REACT APP.  The design spec assumed React throughout;
  kbwiki does not do that, and it is the stack this was told to mirror.  It
  renders DOM directly and loads React for ONE thing — `react-markdown`,
  which emits no raw HTML, so markdown a model wrote cannot become active
  markup.  That is the document reader below, and nothing else needs it.

  THE TOKENS ARE kbwiki's, NOT THE MOCK'S.  The mock's values were marked as
  estimates and several were materially off (`--bad` #C2342B against the real
  #B42318, `--wait` #9A5B00 against #8A5200).  These are copied from
  `kbwiki/ui/static/index.html`, keeping its names, so a reader moving between
  the two apps sees one palette.  `--on-strong` is ours: kbwiki has no filled
  accent button to put text on.

  `?mock=1` renders the design's own fixtures and talks to no backend.  It is
  how the page is reviewed against the mock before a session exists, and it is
  an explicit flag rather than a fallback: without it the page uses the real
  endpoints and says so when they are not there.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* spacing, from the mock */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  /* colour, from kbwiki/ui/static/index.html — its names, its values */
  --bg:#F3F4F6; --panel:#FFFFFF; --line:#E3E5EA; --line-strong:#D5D9E0; --ink:#151922; --ink-2:#3A4150;
  --muted:#5B6372; --accent:#2F4FC9; --accent-ink:#1F3797; --accent-soft:#E8ECFB; --accent-tint:#F6F8FE;
  --wait:#8A5200; --wait-soft:#FBF1DF; --ok:#1E7348; --ok-soft:#E3F2EA; --bad:#B42318; --bad-soft:#FCE8E6;
  --chip:#EEF1F7;
  --on-strong:#FFFFFF;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --drawer-shadow:-4px 0 16px rgba(0,0,0,.12);
  color-scheme:light;
}
/* dark: the system's preference unless the reader chose light, or the reader's own choice */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151C; --panel:#181E27; --line:#2A3240; --line-strong:#364052; --ink:#E6E9EF; --ink-2:#C3C9D4;
    --muted:#98A2B5; --accent:#7B9CFF; --accent-ink:#B9C8FF; --accent-soft:#222C4A; --accent-tint:#1C2336;
    --wait:#F0B45A; --wait-soft:#3A2A12; --ok:#5BC48E; --ok-soft:#16301F; --bad:#FF8A80; --bad-soft:#3A1A18;
    --chip:#222A36; --on-strong:#11151C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151C; --panel:#181E27; --line:#2A3240; --line-strong:#364052; --ink:#E6E9EF; --ink-2:#C3C9D4;
  --muted:#98A2B5; --accent:#7B9CFF; --accent-ink:#B9C8FF; --accent-soft:#222C4A; --accent-tint:#1C2336;
  --wait:#F0B45A; --wait-soft:#3A2A12; --ok:#5BC48E; --ok-soft:#16301F; --bad:#FF8A80; --bad-soft:#3A1A18;
  --chip:#222A36; --on-strong:#11151C; color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
a{color:var(--accent)} a:hover{color:var(--accent-ink)}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr)}

/* ---------------------------------------------------------------- header */
header{background:var(--panel);display:flex;flex-wrap:wrap;align-items:stretch;border-bottom:1px solid var(--line)}
.brand{flex:0 0 auto;padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;justify-content:center;
       border-right:1px solid var(--line)}
.brand .name{font-weight:600;font-size:18px;display:flex;align-items:center;gap:var(--space-2)}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.brand .sub{font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:var(--space-2);max-width:30ch}
/* An email is as long as somebody's email: it gives way, and the full
   value stays in the title. The separator hangs off the name so an
   unknown person is not announced by a stray dot. */
.brand .who{color:var(--ink-2);max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .who:not(:empty)::after{content:"·";margin-left:var(--space-2);color:var(--muted)}
.pills{flex:1 1 520px;display:grid;grid-template-columns:repeat(4,minmax(max-content,1fr));gap:var(--space-2);
       padding:10px var(--space-3);align-items:center}
.pill{padding:6px var(--space-3);border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);
      display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:48px}
.pill .label{display:flex;align-items:center;gap:var(--space-2);font-weight:600;font-size:clamp(13px,1.3vw,16px)}
.pill .label span.t{white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line-strong)}
.pill .sub{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;min-height:16px}
.pill.on-accent{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.pill.on-accent .dot{background:var(--accent)}
.pill.on-wait{background:var(--wait-soft);border-color:var(--wait);color:var(--wait)}
.pill.on-wait .dot{background:var(--wait)}
.pill.on-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pill.on-ok .dot{background:var(--ok)}
.pill.on-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pill.on-bad .dot{background:var(--bad)}
.hright{display:flex;align-items:center;padding:0 var(--space-4);gap:var(--space-2);margin-left:auto}
.hright .k{font-size:12px;color:var(--muted)}
.hright .v{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.hbtn{height:32px;padding:0 var(--space-3);border-radius:8px;border:1px solid var(--line);background:var(--panel);
      color:var(--ink-2);font-size:12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--line-strong)}
.hbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* ----------------------------------------------------------------- alert */
.alert{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-6);
       background:var(--bad-soft);color:var(--bad);border-bottom:1px solid var(--bad)}
.alert .title{font-weight:600;font-size:16px}
.alert .body{font-size:14px;flex:1;min-width:0;color:var(--ink)}
.alert button{background:var(--panel);border:1px solid var(--bad);color:var(--bad);padding:6px var(--space-3);
              border-radius:8px;font-weight:500;cursor:pointer}

main{display:grid;grid-template-columns:clamp(120px,16vw,220px) minmax(0,1fr) clamp(240px,28vw,400px);min-height:0}

/* ------------------------------------------------------------------ days */
nav{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
nav .head{padding:var(--space-4) var(--space-4) var(--space-2);font-size:12px;font-weight:700;text-transform:uppercase;
          letter-spacing:.06em;color:var(--muted)}
nav button{display:block;text-align:left;padding:var(--space-3) var(--space-4);border:0;border-top:1px solid var(--line);
           background:transparent;color:var(--ink);cursor:pointer;width:100%}
nav button:hover{background:var(--chip)}
nav button.on{background:var(--accent-soft);color:var(--accent-ink)}
nav button.archived{color:var(--muted);cursor:default}
nav button.archived:hover{background:transparent}
nav button .l{display:flex;flex-direction:column;gap:2px;min-width:0}
nav button .label{font-weight:600;font-size:15px}
nav button .meta{font-size:12px;opacity:.8}
nav .note{margin-top:auto;padding:var(--space-4);font-size:12px;line-height:1.45;color:var(--muted);
          border-top:1px solid var(--line)}
nav .note code{font-family:var(--mono)}

/* ------------------------------------------------------------ transcript */
.mid{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0;position:relative}
.scroll{overflow:auto;padding:0 clamp(16px,2.5vw,32px) var(--space-8)}
.dayhead{position:sticky;top:0;z-index:1;background:var(--bg);display:flex;align-items:baseline;gap:var(--space-3);
         padding:var(--space-6) 0 var(--space-2);border-bottom:1px solid var(--line)}
.dayhead .label{font-weight:600;font-size:20px}
.dayhead .date{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:var(--space-4);padding:var(--space-4) 0;
     border-bottom:1px solid var(--line)}
.row .at{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.row .body{min-width:0}
.said{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.said .who{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;align-items:center;gap:var(--space-3);height:34px;padding:0 var(--space-3);
     border:1px solid var(--line-strong);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer;
     max-width:100%;position:relative;overflow:hidden}
.bar:hover{background:var(--chip)}
.bar .prog{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent-soft)}
.bar .glyph,.bar .dur{position:relative}
.bar .dur{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.heard{margin:var(--space-2) 0 0;font-size:15px;line-height:1.45;color:var(--ink-2);max-width:68ch;
       text-wrap:pretty}
.heard.waiting{display:flex;align-items:center;gap:var(--space-2);color:var(--muted);font-size:13px}
.spin{width:12px;height:12px;flex:none;border-radius:50%;border:2px solid var(--line-strong);
      border-top-color:var(--accent);animation:turn .8s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
/* A spinner is a claim that something is happening; it must not become
   the only way to learn that.  With motion reduced it stops turning and
   the words beside it carry the meaning on their own. */
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-top-color:var(--line-strong)}}
.spoke{display:flex;flex-direction:column;gap:var(--space-2);padding-left:var(--space-4);
       border-left:3px solid var(--accent)}
.spoke.sounding{border-left-color:var(--ok)}
.spoke p{margin:0;font-size:18px;line-height:1.5;text-wrap:pretty;max-width:68ch}
.spoke p.nothing{font-size:15px;color:var(--muted);font-style:italic}
.spoke .meta{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font-size:13px}
.listen{display:flex;align-items:center;gap:var(--space-2);padding:3px 10px;border:1px solid var(--line-strong);
        border-radius:999px;background:var(--panel);color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer}
.listen:hover{background:var(--chip)}
.listen.sounding{background:var(--ok-soft);color:var(--ok)}
.tag{font-size:12px;padding:2px 10px;border-radius:999px}
.tag.wait{background:var(--wait-soft);color:var(--wait)}
.tag.bad{background:var(--bad-soft);color:var(--bad);font-weight:500}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.tag.neutral{background:var(--chip);color:var(--ink-2)}
.anotado{display:flex;gap:var(--space-3);align-items:baseline;flex-wrap:wrap}
.anotado .text{font-size:15px;line-height:1.45}
.fuentes{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:var(--space-2);font-size:13px}
.fuentes .lbl{color:var(--muted);font-size:12px}
.fuentes a{color:var(--accent-ink)}
/* A wiki page has no address of its own, so its id is shown to be read
   and copied rather than clicked: anything that LOOKED like a link and
   went nowhere would be worse than plain text. */
.fuentes .nodo{font-family:var(--mono);color:var(--ink-2);word-break:break-all}
.note-row{display:flex;gap:var(--space-3);align-items:baseline;flex-wrap:wrap;font-family:var(--mono);font-size:13px;
          color:var(--muted)}
.note-row .x{background:var(--wait-soft);color:var(--wait);padding:1px 8px;border-radius:999px;font-weight:500}
.audit{font-family:var(--mono);font-size:12px;color:var(--muted)}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:2;border:1px solid var(--accent);
      background:var(--accent);color:var(--on-strong);border-radius:999px;padding:6px var(--space-4);font-size:13px;
      font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* --------------------------------------------------------------- push to talk */
.tray{border-top:1px solid var(--line);padding:var(--space-3) clamp(16px,2.5vw,32px);background:var(--panel)}
.ptt{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-4);
     padding:var(--space-4) var(--space-6);border:1px solid var(--accent);border-radius:12px;background:var(--accent);
     color:var(--on-strong);cursor:pointer;text-align:left;user-select:none;touch-action:none}
.ptt .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ptt .title{font-weight:600;font-size:clamp(18px,2.2vw,30px);letter-spacing:-.01em;line-height:1.1}
.ptt .sub{font-size:14px;opacity:.9}
.ptt .time{font-weight:600;font-size:clamp(24px,3vw,40px);font-variant-numeric:tabular-nums}
.ptt.rec{background:var(--bad);border-color:var(--bad);color:var(--on-strong)}
.ptt.idle-speaking{background:var(--panel);border-color:var(--line-strong);color:var(--ink)}
.ptt:disabled{background:var(--chip);border-color:var(--line);color:var(--muted);cursor:not-allowed}

/* ------------------------------------------------------------- knowledge */
aside{background:var(--panel);border-left:1px solid var(--line);display:grid;
      grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0}
.engines{border-top:1px solid var(--line);padding:var(--space-3) var(--space-4);
         display:flex;flex-direction:column;gap:var(--space-2)}
.engines .head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.engines .agent{display:flex;flex-direction:column;gap:2px}
.engines .who{font-size:12px;font-weight:600;color:var(--ink-2)}
.engines .tier{display:flex;align-items:baseline;gap:var(--space-2);flex-wrap:wrap;padding-left:var(--space-2)}
.engines .name{font-size:12px;color:var(--muted);min-width:66px}
.engines .model{font-family:var(--mono);font-size:12px;color:var(--ink)}
.engines .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-top:var(--space-2)}
.engines .kv{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)}
.engines .k{font-size:12px;color:var(--muted)}
.engines .v{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right}
.engines .v .of{color:var(--muted)}
.engines .bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:2px 0 6px}
.engines .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.engines .bar.hot i{background:var(--wait)}
.engines .bar.over i{background:var(--bad)}
.engines .note{font-size:11px;color:var(--muted);margin-top:var(--space-1)}
.langs{display:flex;gap:2px}
.langs .hbtn{padding:2px 6px;font-size:14px;line-height:1.2;filter:grayscale(1);opacity:.55}
.langs .hbtn.on{filter:none;opacity:1}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line)}
.counts .cell{padding:var(--space-3);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
              display:flex;flex-direction:column;gap:2px;min-width:0}
.counts .label,.counts .hint{font-size:12px;color:var(--muted)}
.counts .n{display:flex;align-items:baseline;gap:var(--space-2)}
.counts .v{font-weight:600;font-size:clamp(22px,2.2vw,30px);font-variant-numeric:tabular-nums}
.counts .d{font-size:13px;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.tabs button{padding:var(--space-2) var(--space-3);border:0;border-right:1px solid var(--line);background:transparent;
             color:var(--ink-2);font-weight:600;font-size:13px;text-align:left;cursor:pointer;display:flex;
             flex-direction:column;gap:1px;min-width:0}
.tabs button.on{background:var(--accent-soft);color:var(--accent-ink)}
/* The second row is subordinate to the first and says so: smaller, on
   the panel's own ground, and with the active one marked by a rule
   rather than a fill, so two filled tabs never compete for "where am
   I". */
.tabs.sub{grid-template-columns:repeat(2,minmax(0,1fr));background:var(--bg)}
.tabs.sub button{font-weight:500;font-size:12px;padding:var(--space-2) var(--space-3);
                 border-bottom:2px solid transparent}
.tabs.sub button.on{background:transparent;color:var(--accent-ink);
                    border-bottom-color:var(--accent);font-weight:600}
.tabs.sub button .n{font-size:11px}
.tabs button .n{font-weight:400;font-size:12px;opacity:.8}
.list{overflow:auto;min-height:0;display:flex;flex-direction:column}
.list .tabs.sub{flex:none;position:sticky;top:0;z-index:1}
.list .item{width:100%;display:flex;flex-direction:column;gap:var(--space-1);text-align:left;
            padding:var(--space-3) var(--space-4);border:0;border-bottom:1px solid var(--line);background:transparent;
            color:var(--ink);cursor:pointer}
.list .item:hover{background:var(--accent-tint)}
.list .empty{padding:var(--space-3) var(--space-4);font-size:12px;color:var(--muted);
             border-bottom:1px solid var(--line)}
.list .item .text{font-size:14px;line-height:1.4;font-weight:600}
.list .item .meta{font-size:12px;color:var(--muted)}
.detail{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}
.detail .back{align-self:flex-start;border:0;background:transparent;color:var(--accent);font-size:13px;padding:0;
              cursor:pointer}
.detail .title{font-weight:600;font-size:20px;line-height:1.25}
.detail p{margin:0;font-size:15px;line-height:1.55}
.detail .tags{display:flex;gap:var(--space-2);flex-wrap:wrap}
.detail .two{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.detail .two .a{padding:var(--space-3) var(--space-3) var(--space-3) 0;border-right:1px solid var(--line)}
.detail .two .b{padding:var(--space-3)}
.detail .two .k{font-size:12px;color:var(--muted)}
.detail .two .v{font-weight:600;font-size:22px}
.detail .track{height:6px;border-radius:3px;background:var(--chip);margin-top:6px}
.detail .track .fill{height:6px;border-radius:3px;background:var(--accent)}
.detail .mono{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.primary{align-self:flex-start;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--accent);
         background:var(--accent);color:var(--on-strong);font-weight:500;cursor:pointer}

/* ----------------------------------------------------------- doc reader */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;justify-content:flex-end;
       z-index:10}
.sheet{width:min(760px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);
       box-shadow:var(--drawer-shadow)}
.sheet .top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:var(--space-4);
            padding:var(--space-4) var(--space-8);border-bottom:1px solid var(--line)}
.sheet .top .path{font-family:var(--mono);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
                  white-space:nowrap}
.sheet .top .who{font-size:12px;color:var(--muted)}
.md{padding:var(--space-8);max-width:68ch}
.md>*{margin:0 0 var(--space-4)}
.md h1{font-weight:600;font-size:36px;line-height:1.1;letter-spacing:-.01em}
.md h2{font-weight:600;font-size:22px;padding-top:var(--space-3);border-top:1px solid var(--line);
        margin-top:var(--space-4)}
.md h3{font-weight:600;font-size:18px}
.md p,.md li{font-size:17px;line-height:1.6;text-wrap:pretty}
.md ul,.md ol{padding-left:var(--space-6)}
.md li::marker{color:var(--accent)}
.md code{font-family:var(--mono);font-size:14px;background:var(--chip);padding:1px 5px;border-radius:4px}
.md pre{font-family:var(--mono);font-size:14px;background:var(--chip);padding:var(--space-4);border-radius:8px;
        overflow:auto}

<style>
/* The band is a statement, not a decoration: it says somebody else is
   here, and it stays until they are not. */
#guest-band { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 8px 14px; background: var(--accent-soft, #2d2a12);
  border-bottom: 1px solid var(--line, #333); font-size: 13px; }
#guest-band .nm { font-weight: 600; }
#guest-band .warn { opacity: .8; }
#guest-band .why { opacity: .95; max-width: 40em; }
#guest-band button { margin-left: auto; }
#guest-offer { padding: 14px; display: flex; gap: 10px; align-items: center;
  flex-wrap: wrap; border-bottom: 1px solid var(--line, #333); }
#guest-offer .nm { font-weight: 600; }
.invite { display: flex; gap: 6px; align-items: center; }
.invite input { width: 15em; }

</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">
      <div class="name"><span class="dot"></span>escriba</div>
      <div class="sub"><span class="who" id="who"></span><span id="session-at"></span></div>
    </div>
    <div class="pills" id="pills" aria-live="polite"></div>
    <div class="hright" id="hright" title="">
      <span class="k" id="audio-in"></span><span class="v" id="playback-where"></span>
      <span class="langs" id="langs"></span>
      <button class="hbtn" id="guest-btn" aria-pressed="false"></button>
      <button class="hbtn" id="audit-btn" aria-pressed="false">ids</button>
      <button class="hbtn" id="theme-btn"></button>
    </div>
  </header>

  <!-- WHO ELSE IS IN THE ROOM, said where the host cannot miss it. A
       second brain somebody can join silently is a trust problem, so
       this band is not dismissible: it is present for exactly as long
       as somebody else can hear the conversation. -->
  <div id="guest-band" hidden></div>
  <!-- The offer, for a person who was invited somewhere. Shown INSTEAD
       of opening their own session: `/invitacion` resolves no person, so
       nothing has been started for them yet and nothing is wasted if
       they go in. -->
  <div id="guest-offer" hidden></div>

  <div id="alert-slot"></div>

  <main>
    <nav>
      <div class="head" id="nav-head"></div>
      <div id="days"></div>
      <div class="note"><span id="nav-note"></span>
        <code>audio/</code>.</div>
    </nav>

    <section class="mid">
      <div class="scroll" id="scroll"></div>
      <button class="jump" id="jump" hidden></button>
      <div class="tray">
        <button class="ptt" id="ptt" aria-pressed="false">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="square" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path>
          </svg>
          <span class="t"><span class="title" id="ptt-title"></span>
            <span class="sub" id="ptt-sub"></span></span>
          <span class="time" id="ptt-time"></span>
        </button>
      </div>
    </section>

    <aside>
      <div class="counts" id="counts"></div>
      <div class="tabs" id="tabs"></div>
      <div class="list" id="panel"></div>
      <div class="engines" id="engines"></div>
    </aside>
  </main>
</div>

<div id="reader-slot"></div>
<audio id="player" hidden></audio>

<!-- React is here for ONE job: markdown a subagent wrote, rendered without raw HTML.
     The same import lines and versions as kbwiki, so both pages pull one copy. -->
<script type="module">
import React from "https://esm.sh/react@19.2.0";
import { createRoot } from "https://esm.sh/react-dom@19.2.0/client";
import Markdown from "https://esm.sh/react-markdown@10.1.0?deps=react@19.2.0";
import remarkGfm from "https://esm.sh/remark-gfm@4.0.1";
const roots = new WeakMap();
window.renderMarkdown = (el, text) => {
  if (!roots.has(el)) roots.set(el, createRoot(el));
  roots.get(el).render(React.createElement(Markdown, { remarkPlugins: [remarkGfm] }, text));
};
</script>

<script>
"use strict";
const MOCK = new URLSearchParams(location.search).has("mock");

// ---------------------------------------------------------------- state
// One object, read by the render functions and written by the hub. Entries
// are kept BOTH ordered and by id: order draws the transcript, and the id
// is what a late audio ref, a streamed token or a `repeats` bump arrives
// against. Position cannot stand in for it — the window drops its oldest
// entry at 400, so every index shifts under a reader looking at an older row.
const S = {
  order: [], byId: new Map(),
  counts: {}, items: { memoria: [], referencias: [], documentos: [] }, days: [],
  status: { status: "listening", query: null },
  session_at: null, archive_dir: null, playback: "navegador",
  //: Who the backend says is connected: the identity their directory was
  //: provisioned for. Empty until the first snapshot, like every other
  //: fact here — a page that has spoken to nothing knows no name.
  who: "",
  tab: "memoria", refTab: "local", engTab: "motor", sel: null, reader: false,
  //: The upload in flight, and whatever the last one said. Kept here
  //: rather than in the DOM because the panel is rebuilt wholesale every
  //: two seconds and a message written into it would vanish mid-read.
  staging: { busy: false, msg: "" },
  //: The upload ceiling, in MB, as the server declares it. Unknown until
  //: the first snapshot: a number typed here would be a second copy of
  //: `staging.MAX_BYTES`, free to drift from the one that does the
  //: refusing.
  stageMb: null,
  // The active catalogue, handed over with each snapshot.  Empty until
  // the first one arrives, which is why `tx` renders the KEY rather than
  // guessing: a Spanish default baked in here would be a second
  // catalogue, drifting from the one the server actually serves.
  locale: "es", locales: [], strings: {},
  // {window, spend} — two readouts kept apart on purpose, see renderEngines.
  consumo: { window: null, spend: null },
  recording: false, rec: 0, playing: null, failed: null,
  alert: null, dismissed: null, everConnected: false, restarting: null,
  //: True once the hub has sent a snapshot.  Before that every count is
  //: UNKNOWN rather than zero: a panel reading "0 documentos" on a page
  //: that has spoken to nothing is a statement about the person's
  //: workspace, and it is one we have no grounds for.
  loaded: false,
  activeDay: null, progSec: 0, engines: [], loadedDays: new Set(),
  wiki: { state: "unwired", rows: [], detail: "", asked: 0 },
  //: Replies already offered to the speakers, by entry id.  A reply is
  //: played ONCE and never again on its own: the audio ref arrives in a
  //: second event after the text, a `repeats` bump re-publishes a row,
  //: and a reconnect re-sends the world.  Without this, any of the three
  //: would sound the answer again.
  autoplayed: new Set(), live: false,
  // Recordings whose voice was already heard live, by sha. The row
  // still carries its `escuchar` button; what this stops is the
  // SECOND, automatic playing of something just heard.
  sounded: new Set(),
  //: GUEST MODE. Set when the person at this browser was invited into
  //: somebody else's session instead of opening their own: a host
  //: working with their escriba can call a colleague in for a few
  //: minutes to supply a detail, and the colleague hears the
  //: conversation, can speak into it and can bring a document.
  //:
  //: `room` is the OPAQUE id of that session, and it is what turns every
  //: call on this page from "mine" into "theirs" — see `api`. Null here
  //: means this page is about its owner's own escriba, which is what it
  //: is for everybody who was invited nowhere.
  guest: false, room: null, host: "",
  //: Which voice is this browser's own, so it never plays its owner back
  //: at them. An opaque id rather than a name: two people called the
  //: same thing would otherwise mute each other.
  selfId: "",
  //: Rooms this person has been offered, and the invitation this person
  //: has issued.
  invited: [], inviting: false, inviteError: null,
  //: EVERYBODY THE HOST HAS NAMED, and whether each is here yet. A list,
  //: because an interview has two sides: a host documenting a topic
  //: calls in two people so that one can correct the other, and the
  //: correction is the thing worth writing down.
  guests: [],
  //: Who holds the turn, published by the server rather than guessed
  //: from the pills. `null` is nobody, `""` is the host, a name is that
  //: guest. With three people the lock has to be VISIBLE: a press that
  //: silently does nothing is the worst affordance in the page.
  floor: null,
  //: Everybody in the room, by name, as the server publishes it.
  present: [],
  //: The other voice, silenced. A host and a guest are often already on
  //: a call together, in which case each hears the other through it and
  //: this page would be a second, delayed copy.
  //: How to link one wiki page, `{id}` where the node id goes. The server
  //: states it; a deployment whose wiki has no browsable page sends null
  //: and a node is shown as its id, never as a link to nowhere.
  wikiPage: null,
  theme: localStorage.getItem("escriba-theme") || "auto",
  showIds: localStorage.getItem("escriba-audit") === "1",
  micReason: null,
};

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
};
const mmss = (s) => Math.floor((s || 0) / 60) + ":" + String(Math.floor((s || 0) % 60)).padStart(2, "0");
// UNKNOWN IS NOT ZERO, here as everywhere else on this page.  A reply
// recorded before the archive carried durations has none, and printing
// "0:00" states a length nobody measured — read back as "/ 0:00" beside
// a counter that is already at 0:08.  The element knows it once the file
// is loaded, so that is used when the record cannot say.
const known = (s) => (typeof s === "number" && s > 0 ? s : null);
function total(e) {
  const fromRecord = known(e.seconds);
  if (fromRecord) return fromRecord;
  return (S.playing === e.id && isFinite(player.duration)) ? known(player.duration) : null;
}
const hhmm = (iso) => {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
};
// LOCAL date, not UTC. `toISOString()` would file a 00:30 turn under
// yesterday anywhere east of Greenwich, and the days column is about the
// person's own evening rather than the server's clock. `/days` sends the
// same local YYYY-MM-DD, read off the manifest in the workspace's timezone.
const dayKey = (iso) => {
  const d = new Date(iso);
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"),
          String(d.getDate()).padStart(2, "0")].join("-");
};

// Weekday and month names come from `Intl` keyed on the chosen locale,
// never from a translated array: the platform already knows every
// locale's names, and a list here would be one more thing to keep in
// step with each catalogue added.
const named = (d, opt) => new Intl.DateTimeFormat(S.locale, opt).format(d);
function dayName(key) {
  const d = new Date(key + "T00:00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - d) / 86400000);
  if (days === 0) return tx("nav.today");
  if (days === 1) return tx("nav.yesterday");
  return named(d, days < 7 ? { weekday: "long" } : { month: "long" });
}
const dayDate = (key) => {
  const d = new Date(key + "T00:00:00");
  return d.getDate() + " " + named(d, { month: "short" });
};

// ---------------------------------------------------------------- theme
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
  $("theme-btn").textContent = tx("header.theme",
    { mode: tx({ auto: "theme.system", light: "theme.light", dark: "theme.dark" }[S.theme]) });
}
$("theme-btn").onclick = () => {
  S.theme = { auto: "light", light: "dark", dark: "auto" }[S.theme];
  localStorage.setItem("escriba-theme", S.theme);
  applyTheme();
};
$("audit-btn").onclick = () => {
  S.showIds = !S.showIds;
  localStorage.setItem("escriba-audit", S.showIds ? "1" : "0");
  $("audit-btn").setAttribute("aria-pressed", String(S.showIds));
  renderTranscript();
};

// ---------------------------------------------------------------- pills
// Four, always rendered, exactly one active. The active one is the hub's
// `status` and never derived from the entries: a view that inferred
// "speaking" from an entry having audio would light it while the file sat
// unplayed, which is the confusion the TUI had.
const PILLS = [
  { k: "listening", label: "status.listening" },
  { k: "thinking", label: "status.thinking" },
  { k: "speaking", label: "status.speaking" },
  { k: "searching", label: "status.searching" },
];
function pillTone(k) {
  if (k === "listening") return S.recording ? "bad" : "accent";
  return { thinking: "wait", speaking: "ok", searching: "accent" }[k];
}
function pillSub(k) {
  if (k === "listening") return S.recording ? tx("status.mic_open") : tx("status.your_turn");
  if (k === "thinking") {
    const waiting = S.order.some((id) => {
      const e = S.byId.get(id);
      return e.kind === "spoke" && e.text && !e.audio;
    });
    return waiting ? "texto listo, audio en camino" : "escriba";
  }
  if (k === "speaking") {
    const e = S.playing ? S.byId.get(S.playing) : null;
    return e && e.audio ? "sonando " + e.audio : "sonando";
  }
  return S.status.query ? "«" + S.status.query + "»" : "";
}
function renderPills() {
  const box = $("pills");
  box.textContent = "";
  for (const p of PILLS) {
    const on = p.k === S.status.status;
    const n = el("div", "pill" + (on ? " on-" + pillTone(p.k) : ""));
    const label = el("div", "label");
    label.append(el("span", "dot"), el("span", "t", tx(p.label)));
    n.append(label, el("div", "sub", on ? pillSub(p.k) : ""));
    box.append(n);
  }
  $("session-at").textContent = S.session_at
    ? tx("header.session", { at: hhmm(S.session_at) }) : tx("header.session.none");
  $("who").textContent = S.who;
  // The name is ellipsised when it is long, so the title carries it in
  // full: a truncated email that cannot be read is not an identity.
  $("who").title = S.who ? tx("header.who.title", { who: S.who }) : "";
  $("hright").title = S.archive_dir ? "audio/" + S.archive_dir : "";
  $("playback-where").textContent = S.playback;
}

// ---------------------------------------------------------------- alert
// "Silence is the failure mode": every path that can fail quietly ends up
// here, because an audio UI that stops working without saying so looks
// exactly like an audio UI waiting for you to speak.
const ALERTS = {
  budget: (d) => [tx("alert.session.title"),
    `Se alcanzó el límite de presupuesto de la sesión a las ${d.at || "—"}. Lo dicho hasta aquí está guardado.`],
  mic: () => [tx("alert.mic.title"),
    tx("alert.mic.body")],
  playback: (d) => [tx("alert.playback.title"),
    `${d.audio || "el audio"} no se pudo reproducir. El audio está en el archivo; el navegador no lo ha decodificado.`],
  // Two different facts, and the copy used to state the wrong one: a page
  // that never reached the backend had not LOST anything.  Somebody
  // reading tx("alert.lost") on a first load goes looking for
  // a network fault that is not there.
  session: (d) => [tx("alert.session.title"),
    `La sesión ha terminado: ${d.detail || "sin detalle"}. Lo dicho hasta aquí está guardado.`],
  // NOT a permission problem, and saying "revisa el permiso" sends the
  // reader looking for a setting the browser is not offering: on an
  // insecure origin Chrome does not expose `navigator.mediaDevices` at
  // all, so the site panel shows sound output and no microphone entry.
  // The fix is the origin, so the copy names the origin.
  insecure: () => [tx("alert.insecure.title"),
    tx("alert.insecure.body")],
  waking: (d) => ["Un momento", d.detail || tx("alert.waking")],
  // Not a failure of anything: a visit ended. Said because the page is
  // about to change under the reader — their own escriba comes back —
  // and a transcript replacing itself with no explanation reads as a bug.
  guest: (d) => [tx("alert.guest.title"), d.reason || tx("guest.closed")],
  // Not a failure either: two people pressed at once and one of them
  // lost. The button is already disabled while the floor is held; this
  // is for the press that raced it.
  floor: (d) => [tx("alert.floor.title"), tx("alert.floor.body",
                                             { detail: d.detail || "" })],
  // A recording with no audio in it.  Its own kind, because it used to
  // arrive as `connection` and send the person to look at their network
  // for a press that was simply too short to carry anything.
  silence: () => [tx("alert.silence.title"), tx("alert.silence.body")],
  restarting: (d) => ["Reconectando", `${d.reason}. La página se reconecta sola.`],
  connection: (d) => d.had
    ? [tx("alert.offline.title"), tx("alert.offline.body")]
    : [tx("alert.offline.title"), "No se ha podido conectar con el escriba. Reintentando…"],
};
function raise(kind, detail) {
  S.alert = { kind, detail: detail || {}, seq: (S.alert ? S.alert.seq : 0) + 1 };
  S.dismissed = null;
  renderAlert();
}
function clearAlert(kind) {
  if (S.alert && S.alert.kind === kind) { S.alert = null; renderAlert(); }
}
function renderAlert() {
  const slot = $("alert-slot");
  slot.textContent = "";
  if (!S.alert || S.dismissed === S.alert.seq) return;
  const [title, body] = ALERTS[S.alert.kind](S.alert.detail);
  const n = el("div", "alert");
  n.setAttribute("role", "alert");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", "20"); svg.setAttribute("height", "20");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "2.25");
  svg.innerHTML = '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>' +
                  '<path d="M12 9v4"></path><path d="M12 17h.01"></path>';
  const ok = el("button", null, "entendido");
  ok.onclick = () => { S.dismissed = S.alert.seq; renderAlert(); };
  n.append(svg, el("div", "title", title), el("div", "body", body), ok);
  slot.append(n);
}

// ---------------------------------------------------------------- days
function renderDays() {
  const box = $("days");
  box.textContent = "";
  for (const d of S.days) {
    const b = el("button", (d.in_view || S.loadedDays.has(d.date)) ? "" : "archived");
    const l = el("span", "l");
    const loaded = d.in_view || S.loadedDays.has(d.date);
    l.append(el("span", "label", dayName(d.date)),
             el("span", "meta", dayDate(d.date) + " · " +
                (loaded ? (d.count || S.loadedDays.has(d.date) ? countOf(d) : 0) + " entradas"
                        : "archivo")));
    b.append(l);
    const here = () => {
      const t = $("scroll").querySelector('[data-day="' + d.date + '"]');
      if (t) $("scroll").scrollTop = t.offsetTop - $("scroll").offsetTop;
      markDay(d.date);
    };
    b.onclick = d.in_view || S.loadedDays.has(d.date) ? here : () => loadDay(d.date, here);
    b.dataset.day = d.date;
    box.append(b);
  }
  markDay(S.activeDay);
}
const countOf = (d) => S.order.filter((id) => dayKey(S.byId.get(id).at) === d.date).length;

// A DAY IS READ BACK FROM THE MANIFEST, not from memory: the view keeps
// 400 entries and a restart keeps none, while `audio/` has every turn.
// What comes back is the talking — the `note` lines were this driver's
// own commentary and were never written down — and it is inserted in
// chronological place rather than appended, because `renderTranscript`
// walks the order and would otherwise draw last Tuesday under today.
async function loadDay(date, then) {
  if (S.loadedDays.has(date)) { then(); return; }
  let rows;
  try {
    const res = await fetch("/day/" + date);
    if (!res.ok) throw new Error(res.status);
    rows = await res.json();
  } catch (err) {
    raise("connection", { had: S.everConnected });
    return;
  }
  S.loadedDays.add(date);
  for (const e of rows) {
    if (S.byId.has(e.id)) continue;
    S.byId.set(e.id, e);
    S.order.push(e.id);
    S.autoplayed.add(e.id);     // history: read, never sounded unasked
  }
  S.order.sort((a, b) => {
    const x = S.byId.get(a), y = S.byId.get(b);
    return x.at === y.at ? a - b : (x.at < y.at ? -1 : 1);
  });
  renderTranscript();
  renderDays();
  then();
}

function markDay(key) {
  S.activeDay = key;
  for (const b of $("days").children) b.classList.toggle("on", b.dataset.day === key);
}

// ------------------------------------------------------------ transcript
// Rows are built once and PATCHED in place. A full redraw would be cheap
// at 400 entries and still wrong: it throws away the scroll position and
// the focus ring while a reply is streaming into the row you are reading.
const rows = new Map();

function entryRow(e) {
  const row = el("div", "row");
  row.dataset.id = e.id;
  row.append(el("div", "at", hhmm(e.at)));
  const body = el("div", "body");
  row.append(body);
  rows.set(e.id, { row, body });
  paint(e);
  return row;
}

function playGlyph(playing, size) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size);
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "currentColor");
  svg.innerHTML = playing ? '<rect x="5" y="5" width="14" height="14"></rect>'
                          : '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
  return svg;
}

// A wiki page's address, or null when this deployment has none. The
// pattern comes from the server, so nothing here knows a kbwiki route.
function wikiHref(id) {
  return S.wikiPage ? S.wikiPage.replace("{id}", encodeURIComponent(id)) : null;
}

function paint(e) {
  const r = rows.get(e.id);
  if (!r) return;
  const playing = S.playing === e.id;
  r.body.textContent = "";
  r.prog = r.playLabel = null;

  if (e.kind === "said") {
    const w = el("div", "said");
    // WHOSE VOICE THIS WAS. Two people can press into one conversation,
    // and a `said` row starts with no text, so without this the
    // transcript is a flat run of identical rows in which neither window
    // can say who spoke. Each side sees the other named and itself bare,
    // which is how every conversation anybody has ever read works.
    w.append(e.by ? el("span", "who other", e.by)
                  : el("span", "who", tx("entry.you")));
    const b = el("button", "bar");
    // The width IS the duration: a column of identical pills says nothing
    // about which utterance was the long one.
    b.style.width = Math.min(100 + (e.seconds || 0) * 8, 420) + "px";
    b.title = e.audio || "";
    const prog = el("span", "prog");
    const span = total(e);
    b.append(prog, (() => { const g = el("span", "glyph"); g.append(playGlyph(playing, "14")); return g; })(),
             el("span", "dur", span ? mmss(span) : "—"));
    b.onclick = () => toggle(e);
    w.append(b);
    if (S.showIds && e.audio) w.append(el("span", "audit", e.audio));
    r.body.append(w);
    // THE PERSON'S OWN WORDS, when a transcriber has produced them.  It
    // arrives after the row is drawn — the recording is transcribed
    // beside the turn, not before it — so this is the same patch-by-id
    // path a late audio ref takes.  Styled apart from the escriba's
    // reply on purpose: the asymmetry of the two voices is the point,
    // and this is a machine's reading of a recording rather than text
    // anybody wrote.
    if (e.text) {
      const said = el("p", "heard", e.text);
      said.title = tx("entry.local_transcript");
      r.body.append(said);
    } else if (e.transcribing) {
      // WHERE THE WORDS WILL GO, while they are being read off the
      // recording.  Only while something is actually working on it: a
      // deployment with no transcriber shows nothing here rather than a
      // placeholder for words that are not coming, which is the same
      // rule the reply's "audio llegando…" follows.
      const wait = el("p", "heard waiting");
      wait.append(el("span", "spin"), el("span", null, "transcribiendo…"));
      r.body.append(wait);
    }
    r.prog = prog;
    return;
  }

  if (e.kind === "spoke") {
    const w = el("div", "spoke" + (playing ? " sounding" : ""));
    if (e.text) {
      w.append(el("p", null, e.text));
    } else if (e.silent) {
      // A turn that produced neither words nor speech.  It happens — the
      // escriba answers from its silent tier and writes nothing — and the
      // honest thing is to say so.  The driver used to substitute the
      // string "(spoke)" here, which a person read as something it had
      // said.
      w.append(el("p", "nothing", "no dijo nada en este turno"));
    }
    const meta = el("div", "meta");
    if (e.audio) {
      const b = el("button", "listen" + (playing ? " sounding" : ""));
      b.title = e.audio;
      const span = total(e);
      const label = el("span", null,
        playing ? "sonando " + mmss(S.progSec) + (span ? " / " + mmss(span) : "")
                : "escuchar" + (span ? " " + mmss(span) : ""));
      b.append(playGlyph(playing, "12"), label);
      b.onclick = () => toggle(e);
      meta.append(b);
      r.playLabel = label;
    } else if (e.silent) {
      // The turn ENDED with no speech.  The escriba has a silent tier —
      // where it annotates and commissions documents — and a reply from
      // there sounds nothing, ever.  Saying "audio llegando…" here is
      // waiting for something that is not coming.
      const t = el("span", "tag neutral", "sin audio");
      t.title = tx("entry.no_audio");
      meta.append(t);
    } else if (e.text) {
      // Text first, audio after: the provider finishes speaking well after
      // the words exist, and waiting for it would hold back the reply.
      meta.append(el("span", "tag wait", "audio llegando…"));
    }
    if (S.failed === e.id) meta.append(el("span", "tag bad", tx("entry.playback_failed")));
    if (S.showIds && e.audio) meta.append(el("span", "audit", e.audio));
    w.append(meta);
    r.body.append(w);
    return;
  }

  if (e.kind === "anotado") {
    const w = el("div", "anotado");
    w.append(el("span", "tag accent", "anotado"), el("span", "text", e.text));
    // WHERE IT CAME FROM, WRITTEN DOWN.  The escriba is forbidden to read
    // a URL aloud — a dictated address helps nobody who is listening —
    // and until this row existed that rule meant the person could not
    // get at it at all: asked for the exact URL of a reference it had
    // just opened, it answered that there was not one.
    if ((e.links || []).length) {
      const box = el("div", "fuentes");
      box.append(el("span", "lbl", tx("entry.sources")));
      for (const f of e.links) {
        if (f.url) {
          const a = el("a", null, f.nombre || f.url);
          a.setAttribute("href", f.url);
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
          a.setAttribute("title", f.url);
          box.append(a);
        } else if (f.nodo && S.wikiPage) {
          const a = el("a", null, f.nombre || f.nodo);
          a.setAttribute("href", wikiHref(f.nodo));
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
          a.setAttribute("title", f.nodo);
          box.append(a);
        } else if (f.nodo) {
          const line = el("div", null);
          line.append(el("span", null, (f.nombre || "") + " "),
                      el("span", "nodo", f.nodo));
          box.append(line);
        }
      }
      w.append(box);
    }
    r.body.append(w);
    return;
  }

  const w = el("div", "note-row");
  w.append(el("span", null, e.text));
  if ((e.repeats || 1) > 1) w.append(el("span", "x", "×" + e.repeats));
  r.body.append(w);
}

function renderTranscript() {
  const sc = $("scroll");
  const atBottom = nearBottom();
  sc.textContent = "";
  rows.clear();
  dayWatch.disconnect();
  let key = null, holder = null;
  for (const id of S.order) {
    const e = S.byId.get(id);
    const k = dayKey(e.at);
    if (k !== key) {
      key = k;
      holder = el("div");
      holder.dataset.day = k;
      const head = el("div", "dayhead");
      head.append(el("span", "label", dayName(k)), el("span", "date", dayDate(k)));
      holder.append(head);
      sc.append(holder);
      observeDay(head, k);
    }
    holder.append(entryRow(e));
  }
  if (atBottom) toBottom();
}

function appendEntry(e) {
  const stick = nearBottom();
  S.byId.set(e.id, e);
  S.order.push(e.id);
  const sc = $("scroll");
  const k = dayKey(e.at);
  let holder = sc.querySelector('[data-day="' + k + '"]');
  if (!holder) {
    holder = el("div");
    holder.dataset.day = k;
    const head = el("div", "dayhead");
    head.append(el("span", "label", dayName(k)), el("span", "date", dayDate(k)));
    holder.append(head);
    sc.append(holder);
    observeDay(head, k);
  }
  holder.append(entryRow(e));
  if (stick) toBottom(); else $("jump").hidden = false;
  renderPills();
  maybeAutoplay(e);
}

function updateEntry(e) {
  const prev = S.byId.get(e.id);
  if (!prev) { appendEntry(e); return; }
  Object.assign(prev, e);
  paint(prev);
  renderPills();
  maybeAutoplay(prev);        // the audio ref usually lands on THIS event
}

// Scroll only if the reader was already at the bottom. Dragging them back
// down while they are reading an older answer is the one thing a live
// transcript must not do.
function nearBottom() {
  const sc = $("scroll");
  return sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
}
function toBottom() {
  const sc = $("scroll");
  sc.scrollTop = sc.scrollHeight;
  $("jump").hidden = true;
}
$("jump").onclick = toBottom;
$("scroll").addEventListener("scroll", () => { if (nearBottom()) $("jump").hidden = true; });

// The first paint has no height yet, so one rAF is not enough: observe the
// scroller and go to the bottom once it actually has something to scroll.
let settled = false;
new ResizeObserver(() => {
  const sc = $("scroll");
  if (!settled && sc.scrollHeight > sc.clientHeight) { settled = true; toBottom(); }
}).observe($("scroll"));

const dayWatch = new IntersectionObserver((hits) => {
  for (const h of hits) if (h.isIntersecting) markDay(h.target.dataset.key);
}, { root: $("scroll"), threshold: 0, rootMargin: "0px 0px -85% 0px" });
function observeDay(head, key) { head.dataset.key = key; dayWatch.observe(head); }

// ---------------------------------------------------------------- counts
function delta(now, start) {
  if (start === null || start === undefined) return null;
  return now - start;
}
function renderCounts() {
  const c = S.counts;
  const u = S.loaded ? null : undefined;        // unknown, not zero
  const cells = [
    { label: tx("counts.curated"), value: c.curated, d: delta(c.curated, c.curated_at_start),
      hint: c.curated_at_start != null ? c.curated_at_start + " al empezar" : "", good: (d) => d >= 0 },
    { label: tx("counts.uncurated"), value: c.raw, d: delta(c.raw, c.raw_at_start),
      hint: c.raw_at_start == null ? "" : c.raw_at_start + " al empezar · " +
            (delta(c.raw, c.raw_at_start) > 0 ? "la cola crece" : "la cola baja"),
      // A growing uncurated queue is the one count whose rise is NOT good
      // news: it is work waiting for the curator, not knowledge gained.
      good: (d) => d <= 0, rising: true },
    { label: tx("panel.references"), value: c.catalogue, d: delta(c.catalogue, c.catalogue_at_start),
      hint: !S.loaded ? ""
            : (c.found || 0) + " encontradas · " + (c.selected || 0) + " elegidas"
              // THE ASKING, NOT ONLY THE OPENING. "0 del wiki" was true
              // of a conversation that had searched twice and found
              // nothing, and indistinguishable from one that never
              // looked — so the person asked the escriba twice whether
              // it was using the wiki, which is a question this line
              // should answer.
              + (S.wiki.state === "failing" ? " · " + tx("wiki.failing")
                 : (S.wiki.asked || (S.wiki.rows || []).length)
                   ? " · " + tx("wiki.asked", { n: S.wiki.asked || 0 })
                     + " · " + tx("wiki.opened", { n: (S.wiki.rows || []).length })
                   : ""),
      good: (d) => d >= 0 },
    { label: tx("panel.documents"), value: S.loaded ? (S.items.documentos || []).length : u,
      d: delta((S.items.documentos || []).length, c.documents_at_start),
      hint: c.documents_at_start != null ? c.documents_at_start + " al empezar" : "", good: (d) => d >= 0 },
  ];
  const box = $("counts");
  box.textContent = "";
  for (const cell of cells) {
    const n = el("div", "cell");
    n.append(el("span", "label", cell.label));
    const line = el("span", "n");
    line.append(el("span", "v", cell.value == null ? "—" : String(cell.value)));
    if (cell.d !== null) {
      // ±0 is shown rather than hidden: "nothing moved" is information,
      // and a blank space is indistinguishable from a count that failed.
      const txt = cell.d === 0 ? "±0" : (cell.d > 0 ? "+" + cell.d : String(cell.d));
      const d = el("span", "d", txt + (cell.rising && cell.d > 0 ? " ↑" : ""));
      d.style.color = cell.d === 0 ? "var(--muted)" : (cell.good(cell.d) ? "var(--ok)" : "var(--wait)");
      line.append(d);
    }
    n.append(line, el("span", "hint", cell.hint));
    box.append(n);
  }
}

// ------------------------------------------------------------- knowledge
const PANEL_KEY = { memoria: "memory", referencias: "references",
                    documentos: "documents" };
const TABS = ["memoria", "referencias", "documentos"];
function renderTabs() {
  const box = $("tabs");
  box.textContent = "";
  for (const t of TABS) {
    const b = el("button", t === S.tab ? "on" : "");
    const listed = (S.items[t] || []).length +
                   (t === "referencias" && S.wiki.state === "ok" ? S.wiki.rows.length : 0);
    b.append(el("span", null, tx("panel." + PANEL_KEY[t])),
             el("span", "n", S.loaded ? String(listed) : "—"));
    b.onclick = () => { S.tab = t; S.sel = null; renderTabs(); renderPanel(); };
    box.append(b);
  }
}
// The detail survives the 2-second reconciliation by being keyed on the
// item's own identity, not its position: the list is replaced wholesale
// every tick, and an index would open a different memory each time.
const keyOf = (tab, it) => tab === "memoria" ? it.id
                         : tab === "referencias" ? (it.id || it.url) : it.path;
function renderPanel() {
  const box = $("panel");
  box.textContent = "";
  // The references panel carries its own tabs, and they stay on screen
  // with a detail open — the same way the panel's own tabs do, so
  // "which list am I in" never depends on having scrolled back.
  const sub = S.tab === "referencias" ? subTabs(box) : null;
  const items = shown();
  if (S.sel) {
    const it = items.find((x) => keyOf(S.tab, x) === S.sel);
    if (it) { box.append(detailOf(it)); return; }
    S.sel = null;        // it is gone from disk; fall back to the list
  }
  if (S.tab === "referencias") { references(box, items); return; }
  for (const it of items) box.append(row(it));
}

//: Which rows the panel is listing right now.  For references that is
//: one of the three ORIGINS, which are different kinds of thing: found
//: here by the judge, granted to this person in the wiki, or handed over
//: by the person themselves.
//
//: The first and the third arrive in ONE list and are told apart by the
//: `origin` the server put on each row — the same field the backend
//: reads the catalogue's two filename prefixes into. A second transport
//: for the third tab would be a second thing to keep in step.
function shown() {
  if (S.tab !== "referencias") return S.items[S.tab] || [];
  if (S.refTab === "wiki") return S.wiki.rows || [];
  return staged(S.refTab === "staged");
}
const staged = (want) => (S.items.referencias || [])
  .filter((r) => (r.origin === "staged") === want);

function subTabs(box) {
  const w = S.wiki || { state: "unwired", rows: [], asked: 0 };
  const sub = el("div", "tabs sub");
  for (const [key, label, n] of [
        ["local", tx("refs.local"), String(staged(false).length)],
        ["staged", tx("refs.staged"), String(staged(true).length)],
        ["wiki", tx("refs.wiki"),
         (w.state === "ok" || w.state === "unused")
           ? String((w.rows || []).length) : tx("wiki." + w.state)]]) {
    const b = el("button", key === S.refTab ? "on" : "");
    b.append(el("span", null, label), el("span", "n", n));
    b.onclick = () => { S.refTab = key; S.sel = null; renderPanel(); };
    sub.append(b);
  }
  box.append(sub);
  return sub;
}

function row(it) {
  const b = el("button", "item");
  const meta = S.tab === "memoria" ? [it.at, (it.tags || []).join(", ")].filter(Boolean).join(" · ")
             : S.tab === "referencias" ? refMeta(it)
             : [it.at, it.path].filter(Boolean).join(" · ");
  b.append(el("span", "text", it.text), el("span", "meta", meta));
  b.onclick = () => { S.sel = keyOf(S.tab, it); renderPanel(); };
  return b;
}

// THREE ORIGINS, THREE TABS.  A reference found here — searched from a
// memory's tags and kept by the judge — one the person is granted in the
// wiki, and one the person handed over themselves are different kinds of
// thing, and which one you are looking at should not need reading a row
// to tell.  The wiki tab also carries its own STATE in place of a count,
// because an empty list and a server that did not answer look identical
// and mean opposite things.
function references(box, rows) {
  const w = S.wiki || { state: "sin conectar", rows: [], detail: "" };
  if (S.refTab === "staged") box.append(uploader());
  if (S.refTab === "wiki" && w.state !== "ok") {
    // THE STATE IS A CODE; the sentence is the catalogue's. `detail` is
    // the server's own account of a failure and has no translation.
    box.append(el("div", "empty",
                  tx("wiki." + w.state) + (w.detail ? " — " + w.detail : "")));
    return;
  }
  if (!rows.length) {
    box.append(el("div", "empty", S.refTab === "wiki"
      ? tx("panel.empty.hidden")
      : tx("panel.empty.none")));
    return;
  }
  for (const it of rows) box.append(row(it));
}
function host(url) { try { return new URL(url).host; } catch (e) { return url; } }

// THREE ORIGINS, THREE THINGS WORTH SAYING IN ONE LINE.  A reference
// found here is placed by its host, a staged document by its size, and a
// wiki page by when the escriba opened it -- it has neither.  This used
// to be `host(it.url)` for anything not staged, and `host(undefined)`
// returns its argument, so a wiki row's second column read "undefined".
function refMeta(it) {
  if (it.origin === "staged") return weight(it);
  if (it.origin === "wiki") return it.at || "";
  return host(it.url);
}

// How big a staged document is, or that it is GONE.  A missing file is
// said rather than drawn as zero bytes: the catalogue still offers the
// document, and "0 B" would read as an empty one.
function weight(it) {
  if (it.size == null) return tx("stage.missing");
  const kb = it.size / 1024;
  return kb < 1 ? it.size + " B"
       : kb < 1024 ? dec(kb, 1) + " KB"
       : dec(kb / 1024, 1) + " MB";
}

// WHAT PUTS A DOCUMENT IN FRONT OF THE ESCRIBA.  One control, on the one
// tab whose rows it creates: an upload button anywhere else would offer
// to add to a list the person cannot add to.
function uploader() {
  const box = el("div", "upload");
  const input = el("input");
  input.type = "file";
  input.id = "stage-file";
  input.hidden = true;
  input.onchange = () => { if (input.files && input.files[0]) stageDocument(input.files[0]); };
  const b = el("button", "primary", S.staging.busy ? tx("stage.busy") : tx("stage.add"));
  b.id = "stage-btn";
  b.disabled = S.staging.busy;
  b.onclick = () => input.click();
  box.append(input, b, el("div", "note", tx("stage.hint")));
  if (S.staging.msg) box.append(el("div", "bad", S.staging.msg));
  return box;
}

// The upload itself.  The ROW is not added here: the panel reads the
// catalogue on its own tick and the row arrives by the same route as
// every other reference, so there is one writer of that list and no
// chance of a row the server does not have.
//
// NAMED FOR WHAT IT SENDS, and so is `sendUtterance`.  Both were called
// `send`, both were declared at the top level of this one script, and a
// second function declaration simply REPLACES the first — so every
// upload called the recorder, which ignored the file, posted an empty
// `audio` part to `/talk`, and left the server raising on a zero-length
// recording.  `/stage` was never called by anything.  Nothing warned:
// the page parses, both halves read correctly on their own, and the
// guard that compared this function's field name against the route's
// parameter proved a STRING, never that the function runs.
async function stageDocument(file) {
  S.staging.busy = true; S.staging.msg = ""; renderPanel();
  try {
    if (MOCK) { await new Promise((r) => setTimeout(r, 300)); return; }
    const body = new FormData();
    body.append("document", file, file.name);
    const res = await fetch(api("/stage"), { method: "POST", body });
    if (res.status === 413) {
      S.staging.msg = tx("stage.too_large", { mb: S.stageMb });
    } else if (!res.ok) {
      S.staging.msg = tx("stage.failed");
    }
  } catch (e) {
    S.staging.msg = tx("stage.failed");
  } finally {
    S.staging.busy = false;
    renderPanel();
  }
}

function detailOf(it) {
  const d = el("div", "detail");
  const back = el("button", "back", "← " + S.tab);
  back.onclick = () => { S.sel = null; renderPanel(); };
  d.append(back, el("div", "title", it.text));
  if (S.tab === "memoria") {
    d.append(el("p", null, it.content || ""));
    const tags = el("div", "tags");
    for (const t of it.tags || []) tags.append(el("span", "tag neutral", t));
    d.append(tags);
    const two = el("div", "two");
    const a = el("div", "a");
    const pct = it.confidence != null ? Math.round(it.confidence * 100) + "%" : "—";
    a.append(el("div", "k", "confianza"), el("div", "v", pct));
    const track = el("div", "track");
    const fill = el("div", "fill");
    fill.style.width = it.confidence != null ? pct : "0%";
    track.append(fill); a.append(track);
    const b = el("div", "b");
    b.append(el("div", "k", "usos"), el("div", "v", String(it.uses ?? "—")));
    two.append(a, b);
    d.append(two, el("div", "mono", [it.id, it.at].filter(Boolean).join(" · ")));
  } else if (S.tab === "referencias" && it.origin === "staged") {
    d.append(el("div", "mono", [it.path, weight(it)].filter(Boolean).join(" · ")));
    const tags = el("div", "tags");
    for (const t of it.tags || []) tags.append(el("span", "tag neutral", t));
    d.append(tags, el("div", "note", tx("stage.hint")));
  } else if (S.tab === "referencias" && it.origin === "wiki") {
    // A WIKI PAGE HAS NO ADDRESS OF ITS OWN — its identity is the node
    // id — so this is a link only where the deployment says one can be
    // built, and the id itself otherwise. The id is not a placeholder
    // for a URL: it is what the librarian cites and what `kb_get_node`
    // takes, so it is worth showing either way.
    const href = wikiHref(it.text);
    if (href) {
      const a = el("a", null, it.text);
      a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.title = href;
      a.style.fontSize = "14px"; a.style.wordBreak = "break-all";
      d.append(a);
    } else {
      d.append(el("div", "mono", it.text));
    }
    d.append(el("div", "mono", it.at || ""));
  } else if (S.tab === "referencias") {
    const a = el("a", null, it.url);
    a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.style.fontSize = "14px"; a.style.wordBreak = "break-all";
    d.append(a, el("div", "mono", tx("refs.no_date")));
  } else {
    d.append(el("div", "mono", it.path));
    const open = el("button", "primary", "Leer documento");
    open.onclick = () => openReader(it);
    d.append(open);
  }
  return d;
}

// ---------------------------------------------------------- the language
// DRAWN FROM THE LOCALES THE SERVER LISTS, never from a list here: a
// catalogue added to i18n/ appears as a flag with no change to this page.
function renderLangs() {
  const box = $("langs");
  if (!box) return;
  box.textContent = "";
  if (S.locales.length < 2) return;      // nothing to choose between
  for (const l of S.locales) {
    const b = el("button", "hbtn" + (l.code === S.locale ? " on" : ""), l.flag);
    b.title = l.name;
    b.setAttribute("aria-pressed", String(l.code === S.locale));
    b.onclick = () => setLocale(l.code);
    box.append(b);
  }
}

function setLocale(code) {
  if (code === S.locale) return;
  if (MOCK) {
    // No backend behind a mock page, so it swaps catalogues itself.
    return fetch("strings/" + encodeURIComponent(code))
      .then((r) => r.json())
      .then((st) => { S.strings = st; S.locale = code; renderAll(); });
  }
  // The server WRITES the choice beside the workspace and publishes a
  // fresh snapshot to every tab this person has open, so the page does
  // not apply it locally: one answer, from one place, to all of them.
  return fetch("locale", { method: "POST",
                           headers: { "content-type": "application/json" },
                           body: JSON.stringify({ locale: code }) });
}

// ------------------------------------------------------------------- i18n
// Every string the page draws comes from the catalogue the server sent.
// A key with no entry renders as the key: loud and greppable, where a
// fallback to Spanish would make an untranslated English page look
// finished — which is how a half-translated product ships for years.
function tx(key, params) {
  let text = S.strings[key];
  if (text == null) return key;
  if (params) {
    for (const [k, v] of Object.entries(params)) text = text.split("{" + k + "}").join(v);
  }
  return text;
}

// --------------------------------------------------------------- engines
// WHO IS ANSWERING, and with what.  Every tier is listed rather than just
// the one that happens to be live: the escriba's `voz` is the only tier
// the person hears and `escribano` is where it annotates and commissions
// documents in silence, so a single name would hide the switch that
// explains why it sometimes goes quiet.  The live tier is NOT shown,
// because nothing on the wire reports it — the framework logs the switch
// and emits no event for it, and a guess here would be a label that is
// wrong exactly when it matters.
function renderEngines() {
  const box = $("engines");
  box.textContent = "";
  const hasMotor = S.engines.length > 0;
  const c = S.consumo || {};
  const hasConsumo = !!(c.window || c.spend);
  if (!hasMotor && !hasConsumo) return;
  const sub = el("div", "tabs sub");
  for (const [key, label] of [["motor", tx("motor.tab")], ["contexto", tx("contexto.tab")]]) {
    const b = el("button", key === S.engTab ? "on" : "");
    b.append(el("span", null, label));
    b.onclick = () => { S.engTab = key; renderEngines(); };
    sub.append(b);
  }
  box.append(sub);
  if (S.engTab === "contexto") return renderConsumo(box, c);
  for (const e of S.engines) {
    const a = el("div", "agent");
    // The provider is TEXT, not a tooltip: it is half of what answers
    // and a reader should not have to hover to learn it.  Shown once on
    // the agent when every tier agrees, and per tier when they do not —
    // tiers may span providers, so one line cannot always speak for all
    // of them.
    const providers = [...new Set(e.rows.map((r) => r.provider).filter(Boolean))];
    const shared = providers.length === 1 ? providers[0] : null;
    a.append(el("div", "who", e.agent + (shared ? " · " + shared : "")));
    for (const r of e.rows) {
      const row = el("div", "tier");
      if (r.tier) row.append(el("span", "name", r.tier + (r.audible ? " ♪" : "")));
      row.append(el("span", "model",
                    (shared ? "" : (r.provider ? r.provider + " · " : "")) + (r.model || "—")));
      a.append(row);
    }
    box.append(a);
  }
}

// ------------------------------------------------------- consumo (context)
// TWO READOUTS, NOT TWO VIEWS OF ONE NUMBER, which is the mistake this is
// written to avoid.  `ventana` is how full the shared history is and
// belongs to no particular model; `gasto` is what has been spent, which
// on a TIERED profile like the escriba's is several bills against one
// history.  Merging them produces a figure no binding ever had.
//
// Three rules carried from the daemon's own contract, each one a way a
// readout starts lying:
//   - ABSENT IS NOT ZERO.  A dimension nothing measured is omitted, never
//     drawn as 0: a session with no pricing table must not read as free.
//   - A COST SAYS WHERE IT CAME FROM (`cost_source`: provider, pricing
//     table or mixed), because a bare float's meaning depends on it.
//   - THE PAYLOAD IS THE DAEMON'S.  Keys it carries that this table does
//     not name are still shown, after the ones it does, so a dimension
//     added later appears instead of being silently dropped.
const NUM = new Intl.NumberFormat("es-ES");
// The dimension NAMES are catalogue keys; the daemon decides which
// dimensions exist, this only decides what each is called.
const DIM = ["usd", "turns", "tool_calls", "seconds", "tokens"];

function sec(v) {
  const n = Math.round(Number(v) || 0);
  if (n < 60) return n + " s";
  const m = Math.floor(n / 60);
  return m < 60 ? `${m} m ${n % 60} s` : `${Math.floor(m / 60)} h ${m % 60} m`;
}
// Decimals carry a COMMA here, and money is formatted by hand rather
// than through `NUM`: Intl's default maximumFractionDigits is 3 and it
// parses a `toFixed(2)` string back to a number, so a 10.00 ceiling came
// out as "10" — a money figure quietly losing its cents.
const dec = (v, n) => Number(v).toFixed(n).replace(".", ",");
function dimv(dim, v) {
  if (v == null) return "—";
  if (dim === "usd") return dec(v, 2) + " $";
  if (dim === "seconds") return sec(v);
  return NUM.format(Math.round(Number(v)));
}
function kv(box, k, v, of) {
  const r = el("div", "kv");
  const val = el("span", "v");
  val.append(el("span", null, v));
  if (of) val.append(el("span", "of", tx("unit.of", { v: of })));
  r.append(el("span", "k", k), val);
  box.append(r);
}
function bar(box, pct) {
  const cls = pct >= 100 ? "bar over" : pct >= 80 ? "bar hot" : "bar";
  const b = el("div", cls);
  const i = el("i");
  i.style.width = Math.max(0, Math.min(100, pct)) + "%";
  b.append(i);
  box.append(b);
}

function renderConsumo(box, c) {
  const w = c.window, sp = c.spend;
  if (!w && !sp) {
    box.append(el("div", "note", tx("consumo.unmeasured")));
    return;
  }
  if (w) {
    box.append(el("div", "grp", tx("consumo.window")));
    const pct = Number(w.percent_used);
    if (Number.isFinite(pct)) {
      bar(box, pct);
      kv(box, tx("consumo.occupied"), dec(pct, 1) + " %");
    }
    if (w.tokens_remaining != null) kv(box, tx("consumo.available"), NUM.format(w.tokens_remaining));
    // The useful limit, not the raw window: `percent_used` and
    // `tokens_remaining` are ALREADY net of what each request reserves
    // for its own output (jaato#1444).  Showing the raw window beside
    // them is arithmetic the reader cannot make work, so the reservation
    // is named instead of quietly subtracted.
    if (w.effective_limit != null) kv(box, tx("consumo.useful_limit"), NUM.format(w.effective_limit));
    if (w.reserved_output) {
      kv(box, "reservado para la respuesta", NUM.format(w.reserved_output));
      box.append(el("div", "note",
        "lo ocupado y lo disponible ya descuentan esta reserva"));
    }
    if (w.turns != null) kv(box, tx("consumo.turns"), NUM.format(w.turns));
  }
  if (!sp) return;
  const b = sp.budget;
  if (b && b.limits) {
    box.append(el("div", "grp", tx("consumo.spend")));
    const frac = Number(b.fraction_used);
    if (Number.isFinite(frac)) bar(box, frac * 100);
    // The DECLARED dimensions decide what exists here, not a list in this
    // page: an undeclared dimension is unbounded and has no ceiling to
    // show, and one added to the profile later must appear by itself.
    for (const dim of Object.keys(b.limits)) {
      kv(box, DIM.includes(dim) ? tx("dim." + dim) : dim,
         dimv(dim, (b.used || {})[dim]), dimv(dim, b.limits[dim]));
    }
    if (b.next_rung) {
      box.append(el("div", "note",
        tx("consumo.next_rung", { pct: Number(b.next_rung.at_percent).toFixed(0) })
        + (b.next_rung.action ? " · " + b.next_rung.action : "")));
    }
    if (b.exhausted_reason) {
      box.append(el("div", "note", "agotado: " + b.exhausted_reason));
    }
  }
  const t = sp.totals || {};
  const shown = new Set();
  const rows = [
    ["uncached_input_tokens", tx("consumo.new_input")],
    ["cache_read_tokens", tx("consumo.cache_read")],
    ["cache_creation_tokens", tx("consumo.cache_write")],
    ["output_tokens", tx("consumo.output")],
    ["reasoning_tokens", tx("consumo.reasoning")],
  ];
  const any = rows.some(([k]) => t[k] != null);
  if (any) box.append(el("div", "grp", tx("consumo.tokens")));
  for (const [k, label] of rows) {
    shown.add(k);
    if (t[k] != null) kv(box, label, NUM.format(t[k]));
  }
  // `reasoning_tokens` is a SUBSET of `output_tokens` (jaato#1047) --
  // labelled "de ella" above so nobody adds the two.
  if (t.cost_usd != null) {
    kv(box, tx("consumo.measured_cost"), dec(t.cost_usd, 4) + " $");
    if (t.cost_source) box.append(el("div", "note",
      tx("consumo.cost_source", { src: t.cost_source })));
  }
}

// ------------------------------------------------------------ doc reader
async function openReader(it) {
  const slot = $("reader-slot");
  slot.textContent = "";
  const scrim = el("div", "scrim");
  const sheet = el("article", "sheet");
  const top = el("div", "top");
  const close = el("button", "hbtn", "Cerrar");
  close.onclick = closeReader;
  top.append(el("span", "path", it.path), el("span", "who", "documentalista · " + (it.at || "")), close);
  const body = el("div", "md");
  sheet.append(top, body);
  scrim.append(sheet);
  scrim.onclick = closeReader;
  sheet.onclick = (ev) => ev.stopPropagation();
  slot.append(scrim);
  close.focus();
  const text = MOCK ? MOCK_DOC : await fetch("/doc?path=" + encodeURIComponent(it.path))
    .then((r) => r.ok ? r.text() : Promise.reject(new Error(r.status)))
    .catch(() => "No se pudo leer el documento.");
  if (window.renderMarkdown) window.renderMarkdown(body, text);
  else body.textContent = text;   // the module did not load; show the source
}
function closeReader() { $("reader-slot").textContent = ""; }
window.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeReader(); });

// -------------------------------------------------------------- playback
// ONE element for the page, so two recordings can never sound at once.
// `hablando` goes on at `playing` and not at the click: the state means
// sound is coming out, not that somebody asked for it.
//
// ONLY THE BROWSER PLAYS.  The design kept `audio en: servidor` as a
// deployment option, where the reply sounds on the host and `hablando`
// would come from the hub instead of from this element.  Nothing in this
// deployment can serve that: the daemon runs headless and the tenant
// account has `nologin`, so there is no audio device and no user session
// to hold one.  The header renders whatever the backend reports, and the
// backend reports `navegador`, because shipping a selector whose other
// value cannot work is worse than shipping one value.
const player = $("player");

// ---- THE VOICE, WHILE IT IS STILL ARRIVING ---------------------------
//
// The file the row plays is a RECORD; this is the reply sounding. The
// server publishes the model's voice in half-second pieces of headerless
// PCM — the same bytes the terminal feeds to PulseAudio — because the
// file is named after the digest of the WHOLE utterance and so cannot be
// named until it is over. Waiting for it meant seconds of silence under
// a "hablando" pill.
//
// Web Audio and not an <audio> element, deliberately: these are raw
// samples with no container, every piece independently playable, and
// nothing here depends on how a browser treats a media file whose length
// it does not yet know.
const VOICE = { ctx: null, at: 0, stream: null, sources: [], played: false };

// A CONTEXT IS ONLY ALLOWED WHERE THE PERSON ASKED FOR SOUND. Browsers
// refuse to start audio before an interaction, which is a policy and not
// a fault — the same policy the row's autoplay already lives with. So the
// context is created on the first press of anything, and a reply that
// arrives before that one is heard from the file instead, exactly as it
// was before any of this existed.
function wake() {
  if (!VOICE.ctx) VOICE.ctx = new AudioContext();
  if (VOICE.ctx.state === "suspended") VOICE.ctx.resume();
}
for (const ev of ["pointerdown", "keydown"]) window.addEventListener(ev, wake);

function hush() {
  for (const src of VOICE.sources) { try { src.stop(); } catch (e) {} }
  VOICE.sources = [];
  VOICE.at = 0;
}

// WHOSE SESSION A CALL IS ABOUT, decided in one place.
//
// Every endpoint this page talks to has a guest twin, and the twin takes
// the room as a query. Spreading that decision over four call sites is
// how a guest ends up posting an utterance into their OWN escriba while
// watching somebody else's transcript — both halves looking correct, and
// the turn landing in the wrong life.
// ----------------------------------------------------------------- guests
//
// The host arms the door for one named colleague; the colleague is
// offered the room when they next open the page, goes in, speaks, and
// leaves. Nothing here is a login: everybody reaching this page came
// through the proxy already, so what travels is a NAME the host typed
// and an identity the proxy asserted.

async function invite(field) {
  const email = ((field && field.value) || "").trim();
  if (!email.includes("@")) return;
  S.inviteError = null;
  const res = await fetch("/invitar", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email }) }).catch(() => null);
