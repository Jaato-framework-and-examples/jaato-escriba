  // A REFUSAL THE HOST CAN READ. This used to `return` on a refusal, so
  // a rejected address left the field exactly as it was: the press that
  // was turned down and the press that worked looked identical, which
  // is the same silence the lookup behind this exists to end. The three
  // answers go three different places -- fix the address, try again in
  // a moment, or something else entirely -- so they are three strings.
  if (!res || !res.ok) {
    S.inviteError = res && res.status === 404 ? tx("guest.unknown")
                  : res && res.status === 503 ? tx("guest.uncheckable")
                  : tx("guest.refused");
    renderGuest();
    return;
  }
  S.guests = (await res.json()).guests || [];
  S.inviting = false;
  S.inviteError = null;
  renderGuest();
}

// THE HOST HAS READ IT AND IS SENDING IT. Until this runs, the server
// ignores the invitation on every guest route, so there is nothing for a
// guest to find by guessing.
async function sendInvite(email) {
  const res = await fetch("/invitar/enviar", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email }) }).catch(() => null);
  if (!res || !res.ok) return;
  S.guests = (await res.json()).guests || [];
  renderGuest();
}

// ONE OF THEM, OR ALL OF THEM. An interview's two sides do not finish
// together: the colleague who has said their piece leaves while the
// other is still answering, so showing somebody out is by name.
async function uninvite(email) {
  const res = await fetch("/invitar" + (email ? "?email=" +
                          encodeURIComponent(email) : ""),
                          { method: "DELETE" }).catch(() => null);
  S.guests = (res && res.ok && (await res.json()).guests) || [];
  renderGuest();
}

async function enterRoom(room) {
  S.room = room;
  S.invited = [];
  S.guests = []; S.present = []; S.floor = null;
  // The transcript of their own escriba, if they had one open, is not
  // theirs to carry into somebody else's room.
  S.order = []; S.byId.clear(); S.items = {}; S.counts = {}; S.days = [];
  renderAll();
  connect();
}

function leaveRoom() {
  S.room = null; S.guest = false; S.host = "";
  S.guests = []; S.present = []; S.floor = null;
  S.order = []; S.byId.clear();
  renderAll();
  connect();
}

// WHAT THE HOST CANNOT MISS, and the guest's own reminder of where they
// are. Not dismissible on either side: it is true for exactly as long as
// somebody else can hear the conversation, and a band you can close is a
// band you forget.
function renderGuest() {
  const band = $("guest-band"), offer = $("guest-offer"), btn = $("guest-btn");
  band.textContent = ""; offer.textContent = "";
  btn.textContent = tx("guest.invite");
  btn.hidden = S.guest || !S.loaded;

  if (S.guest) {
    band.hidden = false;
    band.append(el("span", "nm", tx("guest.inside", { who: S.host })),
                el("span", "warn", tx("guest.nothing_before")));
    // WHO ELSE IS LISTENING. The host may have called in two people so
    // that one corrects the other; somebody answering into a room
    // without being told who is in it has not been given the chance to
    // decide what to say.
    const others = (S.present || []).filter((n) => n !== S.who);
    if (others.length) {
      band.append(el("span", "warn",
                     tx("guest.present", { who: others.join(", ") })));
    }
    const out = el("button", "hbtn", tx("guest.leave"));
    out.onclick = leaveRoom;
    band.append(out);
  } else if (S.guests.length) {
    band.hidden = false;
    // EVERY ONE OF THEM, each with its own way out. A single line saying
    // "somebody is here" cannot be acted on when there are two.
    for (const g of S.guests) {
      const row = el("span", "invite");
      // THREE STATES, NOT TWO. An address the host has typed is not an
      // invitation yet: the escriba has to say why that person is
      // needed, and the host has to read it, before anybody outside
      // this session sees a word of it.
      row.append(el("span", "nm", g.here
                      ? tx("guest.here", { who: g.name || g.email })
                      : !g.open
                        ? g.email
                        : tx("guest.waiting", { who: g.email })));
      const out = el("button", "hbtn", tx("guest.cancel"));
      out.onclick = () => uninvite(g.email);
      row.append(out);
      band.append(row);
      if (g.open) continue;
      if (!g.motivo) {
        band.append(el("span", "warn", tx("guest.awaiting_reason")));
        continue;
      }
      // WHAT THE GUEST WILL READ, SHOWN BEFORE THEY READ IT. Written by
      // the escriba out of this conversation and about to be read by
      // somebody outside it — the only text here that travels that way,
      // which is why the person whose session it describes sees it
      // first and decides.
      band.append(el("span", "why", tx("guest.topic") + ": " + g.tema),
                  el("span", "why", tx("guest.why") + ": " + g.motivo),
                  el("span", "warn", tx("guest.reason_seen")),
                  el("span", "warn", tx("guest.unsent")));
      const send = el("button", "hbtn", tx("guest.send"));
      send.onclick = () => sendInvite(g.email);
      band.append(send);
    }
    if (S.guests.some((g) => g.here)) {
      // THE CONSEQUENCES THE HOST AGREED TO, said while they are true
      // rather than once at the moment of inviting: the escriba reads
      // the wiki with THEIR grants for as long as somebody else is
      // asking it questions, and every answer is on their bill.
      band.append(el("span", "warn", tx("guest.hears")),
                  el("span", "warn", tx("guest.grants")));
      // THE BILL, WHERE IT CAN BE SEEN. An interview is the long,
      // many-turn session this ceiling was sized against, and the ladder
      // finalises the HOST's session at 80 %. Arriving as a surprise is
      // the avoidable part.
      //
      // READ THE WAY `renderEngines` READS IT, from the daemon's own
      // budget report: `spend.budget.{used,limits}` keyed by dimension.
      // A first attempt invented `spend.usd` and would have rendered
      // nothing, forever, with both halves looking correct.
      const b = S.consumo && S.consumo.spend && S.consumo.spend.budget;
      const used = b && b.used && b.used.usd;
      const cap = b && b.limits && b.limits.usd;
      if (used != null && cap != null) {
        band.append(el("span", "warn", tx("guest.spent", {
          spent: Number(used).toFixed(2), limit: Number(cap).toFixed(2) })));
      }
    }
  } else if (S.inviting) {
    // The field, in the band rather than in a dialog: the host is in the
    // middle of a conversation and a modal would take the page away from
    // them to type one address.
    band.hidden = false;
    const form = el("span", "invite");
    const field = el("input", "");
    field.type = "email";
    field.placeholder = tx("guest.email");
    field.onkeydown = (ev) => { if (ev.key === "Enter") invite(field); };
    const go = el("button", "hbtn", tx("guest.invite"));
    go.onclick = () => invite(field);
    const no = el("button", "hbtn", tx("guest.cancel"));
    no.onclick = () => { S.inviting = false; S.inviteError = null; renderGuest(); };
    form.append(field, go, no);
    band.append(form);
    if (S.inviteError) band.append(el("span", "warn", S.inviteError));
    field.focus();
  } else {
    band.hidden = true;
  }

  // The offer, for somebody who was invited. Shown whether or not their
  // own session is up: going in costs them nothing, and `/invitacion`
  // started nothing on their behalf.
  if (!S.guest && S.invited.length) {
    offer.hidden = false;
    for (const r of S.invited) {
      const line = el("div", "");
      line.append(el("span", "nm", tx("guest.invited_by", { who: r.host })));
      // WHAT THEY ARE BEING CALLED IN FOR, WHILE THEY STILL HAVE THE
      // CHOICE. Written by the host's escriba, which is the one party
      // with the overview of the conversation the guest cannot see.
      if (r.tema) line.append(el("span", "why",
                                 tx("guest.topic") + ": " + r.tema));
      if (r.motivo) line.append(el("span", "why",
                                   tx("guest.why") + ": " + r.motivo));
      const go = el("button", "hbtn", tx("guest.enter"));
      go.onclick = () => enterRoom(r.room);
      const no = el("button", "hbtn", tx("guest.mine"));
      no.onclick = () => { S.invited = []; renderGuest(); connect(); };
      line.append(go, no);
      offer.append(line);
    }
  } else {
    offer.hidden = true;
  }
}

function api(path) {
  if (!S.room) return path;
  return "/invitado" + path +
         (path.includes("?") ? "&" : "?") + "room=" + encodeURIComponent(S.room);
}

function samples(b64) {
  const bin = atob(b64);
  const raw = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
  return new Int16Array(raw.buffer);     // whole samples, by construction
}

function onSpeech(f) {
  if (f.final) {
    // ONLY WHAT WAS ACTUALLY HEARD is suppressed later. A context the
    // browser never let run played nothing, and calling that heard would
    // take the row's autoplay away too and leave the person with silence
    // and no remedy.
    if (f.audio && VOICE.played) S.sounded.add(f.audio);
    VOICE.played = false;
    VOICE.stream = null;
    return;
  }
  // NEVER YOUR OWN VOICE BACK AT YOU. While the press is on, nothing
  // plays at all — but the last pieces of an utterance arrive after the
  // key is up, and without this you would hear your own tail.
  if (f.by_id && f.by_id === S.selfId) return;
  if (S.recording || !VOICE.ctx || VOICE.ctx.state !== "running") return;
  if (f.stream !== VOICE.stream) { hush(); VOICE.stream = f.stream; }
  const ctx = VOICE.ctx;
  const pcm = samples(f.pcm);
  // The buffer keeps the stream's own rate; a context running at another
  // one resamples it on playback, which is the spec's job and not ours.
  const buf = ctx.createBuffer(f.channels, pcm.length / f.channels, f.rate);
  for (let c = 0; c < f.channels; c++) {
    const out = buf.getChannelData(c);
    for (let i = 0; i < out.length; i++) out[i] = pcm[i * f.channels + c] / 32768;
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  // NEVER IN THE PAST. If the network fell behind, the cursor moves up to
  // now rather than scheduling a piece whose moment has gone — the
  // browser drops that one without a word, and the reply loses a word.
  VOICE.at = Math.max(VOICE.at, ctx.currentTime);
  src.start(VOICE.at);
  VOICE.at += buf.duration;
  VOICE.sources.push(src);
  VOICE.played = true;
}

function toggle(e) { start(e, false); }

function start(e, auto) {
  if (S.playing === e.id) { player.pause(); return; }
  if (!e.audio) return;
  S.failed = null;
  S.playing = e.id;
  S.progSec = 0;
  if (MOCK) { mockPlay(e); return; }
  player.src = api("/audio/" + e.audio);
  player.play().catch(() => {
    if (!auto) { fail(e); return; }
    // A BLOCKED AUTOPLAY IS NOT A FAILURE.  The browser withholding
    // sound until somebody has interacted with the page is a policy, not
    // a broken file, and calling it tx("entry.playback_failed") would send
    // the reader to look at an archive that is perfectly fine.  The row
    // keeps its `escuchar` button, which is the whole remedy.
    S.playing = null;
    paint(e);
    renderPills();
  });
}

// WHEN A REPLY SOUNDS BY ITSELF.  The terminal plays the answer as it
// arrives and this should too — a voice assistant that waits to be asked
// twice is not one.  Three guards, each for something that would
// otherwise replay an old answer:
//   - only after the first snapshot, so a reload does not sound history;
//   - once per entry, because text and audio arrive as separate events;
//   - never while the microphone is open, which would be the escriba
//     talking over the person mid-sentence.
function maybeAutoplay(e) {
  if (!S.live || e.kind !== "spoke" || !e.audio || S.autoplayed.has(e.id)) return;
  S.autoplayed.add(e.id);
  if (S.recording) return;
  //   - and never twice: a voice heard live as it arrived must not be
  //     played again the moment its file is named.
  if (S.sounded.has(e.audio)) return;
  start(e, true);
}
function fail(e) {
  S.playing = null;
  S.failed = e.id;
  paint(e);
  raise("playback", { audio: e.audio });
  heard(e, "error");
}
player.addEventListener("loadedmetadata", () => {
  const e = S.byId.get(S.playing);
  if (e && !known(e.seconds)) paint(e);   // the length is knowable now
});
player.addEventListener("playing", () => {
  S.status = { status: "speaking", query: null };
  const e = S.byId.get(S.playing);
  if (e) { paint(e); heard(e, "play"); }
  renderPills();
});
player.addEventListener("timeupdate", () => {
  const e = S.byId.get(S.playing);
  if (!e) return;
  S.progSec = player.currentTime;
  const r = rows.get(e.id);
  if (e.kind === "said" && r && r.prog) {
    r.prog.style.width = (player.duration ? (player.currentTime / player.duration) * 100 : 0) + "%";
  } else if (e.kind === "spoke" && r && r.playLabel) {
    // Only the label, never the row: repainting would rebuild the button
    // the reader just pressed and throw away its focus ring.
    const span = total(e);
    r.playLabel.textContent = "sonando " + mmss(player.currentTime) +
                              (span ? " / " + mmss(span) : "");
  }
});
for (const ev of ["ended", "pause"]) player.addEventListener(ev, () => {
  const e = S.byId.get(S.playing);
  S.playing = null;
  S.progSec = 0;
  if (e) { paint(e); if (ev === "ended") heard(e, "ended"); }
  S.status = { status: "listening", query: null };
  renderPills();
});
player.addEventListener("error", () => {
  const e = S.byId.get(S.playing);
  if (e) fail(e);
});
// What the BROWSER claims happened, recorded as a claim. The server's own
// timestamps say what it sent; this says what a client reported playing,
// and the two are not the same kind of fact.
function heard(e, event) {
  if (MOCK || !e.audio) return;
  // NOT FROM A GUEST. The claim is written into the HOST's archive as a
  // fact about what sounded, and a guest's speakers are not an account
  // of the host's conversation. The row still plays; nothing is recorded.
  if (S.guest) return;
  fetch("/heard", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ audio: e.audio, event, at: new Date().toISOString() }),
  }).catch(() => {});
}

// ----------------------------------------------------------- push to talk
let stream = null, recorder = null, chunks = [], startedAt = 0, ticker = null;
const ptt = $("ptt");

function pttFace() {
  const t = $("ptt-title"), s = $("ptt-sub"), time = $("ptt-time");
  ptt.classList.toggle("rec", S.recording);
  ptt.classList.toggle("idle-speaking", !S.recording && S.status.status === "speaking");
  ptt.setAttribute("aria-pressed", String(S.recording));
  if (S.micReason) {
    ptt.disabled = true;
    t.textContent = tx("alert.insecure.title");
    s.textContent = S.micReason;
    time.textContent = "";
    return;
  }
  // SOMEBODY ELSE HAS THE FLOOR, so this button says so and does not
  // work. The lock has always existed server-side; what is new is that
  // three people can race for it, and a press that silently does
  // nothing is the worst thing this page could do with one.
  const held = S.floor != null && S.floor !== (S.guest ? S.who : "");
  if (held && !S.recording) {
    ptt.disabled = true;
    t.textContent = tx("guest.floor", { who: S.floor || S.host || "" });
    s.textContent = tx("ptt.sub");
    time.textContent = "";
    return;
  }
  ptt.disabled = false;
  t.textContent = S.recording ? "Grabando" : tx("ptt.title");
  s.textContent = S.recording ? "Suelta para enviar"
    : S.status.status === "speaking" ? tx("ptt.interrupt")
    : tx("ptt.sub");
  time.textContent = S.recording ? mmss(S.rec) : "";
}

// Knowable at LOAD, so it is said at load.  Waiting for the first press
// to discover that the browser will never hand over a microphone means
// the person holds a button down, speaks, and is told afterwards.
function micUnavailable() {
  if (!window.isSecureContext) return "requiere https o localhost";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return "este navegador no expone getUserMedia";
  }
  return null;
}

async function mic() {
  if (stream) return stream;
  // Asked at the first press, not on load: a permission prompt that appears
  // before anybody has tried to talk gets dismissed.
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  for (const track of stream.getAudioTracks()) {
    track.onmute = () => { S.micReason = tx("entry.muted"); raise("mic"); pttFace(); };
    track.onunmute = () => { S.micReason = null; clearAlert("mic"); pttFace(); };
    track.onended = () => { S.micReason = tx("entry.ended"); raise("mic"); pttFace(); };
  }
  return stream;
}

// A SECOND TAP ON THE SAME MICROPHONE, and deliberately not a change to
// the first.
//
// `MediaRecorder` keeps doing exactly what it did: one blob on release,
// transcoded server-side into the attachment the model is fed and the
// file the archive keeps. That path produces the record of the
// conversation and it is the last thing that should grow a new failure
// mode. So the live voice the other person hears comes off a SEPARATE
// consumer of the same `MediaStream`, and a piece of it going missing
// costs them a fragment of audio rather than corrupting a turn.
//
// PCM RATHER THAN THE RECORDER'S CHUNKS, which is what makes the far end
// cheap: `MediaRecorder` timeslices are webm, only the first carries a
// header, and playing them needs a MediaSource pipeline. Raw samples are
// what `onSpeech` already schedules for the escriba's own voice, so both
// voices arrive through one decoder and a second playback path never has
// to exist.
const TAP = { ctx: null, node: null, src: null, stream: null, busy: null };

// 128 frames at a time is what the platform hands a worklet; this
// gathers them into the same half second the escriba's relay coalesces
// to, so both voices travel at one cadence.
const TAP_WORKLET = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.n = 0;
                  this.target = Math.round(sampleRate * 0.5); }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) {
      this.buf.push(new Float32Array(ch)); this.n += ch.length;
      if (this.n >= this.target) {
        const out = new Int16Array(this.n);
        let i = 0;
        for (const b of this.buf) for (let k = 0; k < b.length; k++) {
          const v = Math.max(-1, Math.min(1, b[k]));
          out[i++] = v < 0 ? v * 32768 : v * 32767;
        }
        this.port.postMessage(out, [out.buffer]);
        this.buf = []; this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor("tap", Tap);
`;

function tapId() {
  return Math.random().toString(36).slice(2, 12).replace(/[^a-z0-9]/g, "x");
}

// ONE UPLOAD IN FLIGHT, AND THE NEXT ONE AFTER IT. Separate POSTs can
// arrive out of order, and half a second of voice in the wrong place is
// audible as garble. Chaining them keeps the order by construction,
// which is cheaper and more honest than a sequence number and a reorder
// buffer on the far side.
function tapSend(pcm) {
  if (!TAP.stream) return;
  const q = TAP.busy || Promise.resolve();
  TAP.busy = q.then(() => {
    if (!TAP.stream) return;
    return fetch(api("/voz?stream=" + TAP.stream + "&rate=" + TAP.rate +
                     "&channels=1"),
                 { method: "POST", body: pcm,
                   headers: { "Content-Type": "application/octet-stream" } })
      .catch(() => {});
  });
}

async function tapStart() {
  if (!navigator.mediaDevices || !window.AudioWorkletNode) return;
  const s = await mic();
  if (!TAP.ctx) {
    TAP.ctx = new AudioContext();
    const url = URL.createObjectURL(new Blob([TAP_WORKLET],
                                             { type: "application/javascript" }));
    await TAP.ctx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
  }
  if (TAP.ctx.state === "suspended") await TAP.ctx.resume();
  TAP.rate = TAP.ctx.sampleRate;
  TAP.stream = tapId();
  TAP.src = TAP.ctx.createMediaStreamSource(s);
  TAP.node = new AudioWorkletNode(TAP.ctx, "tap");
  TAP.node.port.onmessage = (ev) => tapSend(ev.data);
  // NOT CONNECTED TO THE SPEAKERS. The node's output goes nowhere: this
  // reads the microphone, and routing it to `destination` would play the
  // person's own voice back at them with the hardware's latency on it.
  TAP.src.connect(TAP.node);
}

function tapStop() {
  const stream = TAP.stream;
  TAP.stream = null;
  if (TAP.src) { try { TAP.src.disconnect(); } catch (e) {} TAP.src = null; }
  if (TAP.node) { try { TAP.node.disconnect(); } catch (e) {} TAP.node = null; }
  // AFTER whatever is still going up, so the end marker cannot overtake
  // the last piece of the utterance it ends.
  if (stream) {
    (TAP.busy || Promise.resolve()).then(
      () => fetch(api("/voz?stream=" + stream + "&final=1"), { method: "POST" })
              .catch(() => {}));
  }
}

async function startRec() {
  if (S.recording || S.micReason) return;
  if (!player.paused) player.pause();         // talking over the reply stops it
  hush();   // and so does talking over one that is still arriving
  if (MOCK) { S.recording = true; S.rec = 0; tick(); return; }
  try {
    const s = await mic();
    recorder = new MediaRecorder(s);
    chunks = [];
    recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    recorder.onstop = sendUtterance;
    recorder.start();
    // STARTED BESIDE THE RECORDER AND NEVER AWAITED BY IT: the blob the
    // model gets must not wait on the live tap coming up, and a tap that
    // fails to start costs the other person the audio of this one
    // utterance and nothing else.
    tapStart().catch(() => {});
  } catch (err) {
    S.micReason = err && err.name === "NotAllowedError" ? "permiso denegado" : "no se pudo abrir";
    raise("mic");
    pttFace();
    return;
  }
  S.recording = true;
  S.rec = 0;
  startedAt = performance.now();
  tick();
}
function tick() {
  S.status = { status: "listening", query: null };
  renderPills();
  pttFace();
  clearInterval(ticker);
  ticker = setInterval(() => { S.rec += 0.1; $("ptt-time").textContent = mmss(S.rec); }, 100);
}
function stopRec() {
  if (!S.recording) return;
  clearInterval(ticker);
  S.recording = false;
  // BEFORE EVERY OTHER BRANCH BELOW, including the too-short one: the
  // tap is running from the moment of the press, so whatever happens to
  // the recording, the microphone stops being broadcast here.
  tapStop();
  const held = MOCK ? S.rec * 1000 : performance.now() - startedAt;
  if (MOCK) { pttFace(); mockTurn(Math.max(1, Math.round(S.rec))); return; }
  if (held < 300) {
    // Too short to be speech: a stray click should not become a turn, and
    // an empty attachment is a wasted round trip through the model.
    //
    // UNBOUND BEFORE STOPPING, because `onstop` IS the sender.  This
    // branch exists to suppress the round trip and used to perform it:
    // `recorder.stop()` fires the `stop` event, `sendUtterance` runs off
    // it, and a 120 ms press posted the empty recording this is here to
    // prevent.  Measured in Chrome against the real page.
    try { recorder.onstop = null; recorder.stop(); } catch (e) {}
    recorder = null;
    $("ptt-sub").textContent = "demasiado corto";
    pttFace();
    return;
  }
  try { recorder.stop(); } catch (e) {}
}

async function sendUtterance() {
  const blob = new Blob(chunks, { type: recorder && recorder.mimeType || "audio/webm" });
  recorder = null;
  S.status = { status: "thinking", query: null };
  renderPills();
  pttFace();
  const fd = new FormData();
  fd.append("audio", blob, "utterance.webm");
  try {
    const res = await fetch(api("/talk"), { method: "POST", body: fd });
    if (!res.ok) throw new Error(res.status);
    // The `said` entry comes back over the stream, not optimistically: the
    // id is the digest of the bytes the daemon received, and only the
    // server knows it.
    await readStream(res, onEvent);
  } catch (err) {
    // The upload itself failed, so no turn is running and nothing on the
    // server will correct the optimistic "pensando…" this function set.
    // Saying the connection failed while the pill claims the escriba is
    // thinking describes two different situations at once.
    S.status = { status: "listening", query: null };
    renderPills();
    pttFace();
    raise("connection", { had: S.everConnected });
  }
}

// pointer rather than mouse, with capture: a press that drags off the
// button still ends the recording, instead of leaving the mic open.
ptt.addEventListener("pointerdown", (ev) => {
  ptt.setPointerCapture(ev.pointerId);
  startRec();
});
ptt.addEventListener("pointerup", stopRec);
ptt.addEventListener("pointercancel", stopRec);
window.addEventListener("keydown", (ev) => {
  if (ev.code !== "Space" || ev.repeat || typing(ev.target) || activates(ev.target)) return;
  ev.preventDefault();
  startRec();
});
window.addEventListener("keyup", (ev) => {
  if (ev.code !== "Space" || typing(ev.target) || activates(ev.target)) return;
  ev.preventDefault();
  stopRec();
});
const typing = (t) => t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);

// WHERE SPACE ALREADY MEANS SOMETHING.  A focused control is activated by
// the space bar — that is how a keyboard reaches a button at all — and
// both handlers above called `preventDefault()` on every Space there was,
// on the way down AND on the way up.  So no button in this page could be
// reached from the keyboard: measured in Chrome, Space on a focused
// "aportar documento" opened no file picker, where a click did.
//
// The talk button is the exception, and deliberately: it is HELD, not
// clicked, so the global binding is its keyboard equivalent rather than a
// rival for it.
const activates = (t) => t && t !== ptt &&
  (t.tagName === "BUTTON" || t.tagName === "SELECT" || t.tagName === "SUMMARY");

// ------------------------------------------------------------------- hub
function onEvent(kind, data) {
  if (kind === "state") {
    S.loaded = true;
    S.order = []; S.byId.clear();
    for (const e of data.entries || []) {
      S.byId.set(e.id, e);
      S.order.push(e.id);
      // History, not news: everything in a snapshot has already been
      // heard, or was deliberately not.  A reconnect must be silent.
      S.autoplayed.add(e.id);
    }
    S.live = true;
    S.counts = data.counts || {};
    S.items = data.items || S.items;
    S.status = data.status || S.status;
    S.session_at = data.session_at || null;
    S.archive_dir = data.archive_dir || null;
    S.playback = data.playback || S.playback;
    S.who = data.who || S.who;
    S.stageMb = data.stage_mb != null ? data.stage_mb : S.stageMb;
    S.days = data.days || S.days;
    S.engines = data.engines || S.engines;
    // ABSENT, NOT EMPTY, in a guest's snapshot: that one is built key by
    // key and never carries other people's addresses or the host's
    // reasons for wanting them. So `|| S.guests` rather than `|| []`,
    // which would have blanked the band on a guest's own reconnect.
    S.guests = data.guests || S.guests;
    S.wiki = data.wiki || S.wiki;
    S.wikiPage = data.wiki_page || null;
    S.consumo = data.consumo || S.consumo;
    // The catalogue arrives WITH the snapshot, so the strings and the
    // data they label can never be a version apart.
    S.strings = data.strings || S.strings;
    S.locale = data.locale || S.locale;
    S.locales = data.locales || S.locales;
    // WHO THIS PAGE IS, which decides what it may draw. A guest's
    // snapshot is BUILT narrow — no transcript from before they came in,
    // no memory, no references, no documents — so there is nothing here
    // to hide; this is what stops the page asking for any of it.
    S.guest = !!data.guest;
    S.host = data.host || "";
    S.selfId = data.self_id || "";
    // A RECONNECT COMES BACK TO THE SAME ROOM, not an empty one: who is
    // present and who is talking are state, so they travel with the
    // snapshot like everything else the page redraws from.
    S.present = data.present || [];
    S.floor = data.floor !== undefined ? data.floor : null;
    renderAll();
  } else if (kind === "entry") {
    updateEntry(data);
  } else if (kind === "counts") {
    S.counts = data; renderCounts();
  } else if (kind === "consumo") {
    // A reading we could not take is NOT a zero: the driver withholds a
    // failed probe rather than publishing an empty one, and this keeps
    // what is on screen if an empty one ever arrives anyway.  Blanking a
    // populated panel mid-conversation reads as "nothing spent".
    if (data && (data.window || data.spend)) { S.consumo = data; renderEngines(); }
  } else if (kind === "closing") {
    // A RESTART IS NOT A LOST CONNECTION.  `EventSource` reconnects by
    // itself and is answered with a fresh snapshot, so nothing is needed
    // to recover — but a stream that simply ended looks exactly like a
    // network fault, and the page would spend five seconds accusing one.
    // Said in the server's own words instead.
    S.restarting = data.reason || tx("alert.restarting");
    raise("restarting", { reason: S.restarting });
  } else if (kind === "wiki") {
    S.wiki = data; renderTabs(); renderPanel(); renderCounts();
  } else if (kind === "items") {
    S.items[data.panel] = data.rows;
    renderTabs(); renderPanel(); renderCounts();
  } else if (kind === "status") {
    S.status = data; renderPills(); pttFace();
  } else if (kind === "alert") {
    raise(data.kind, data);
  } else if (kind === "days") {
    S.days = data; renderDays();
  } else if (kind === "speech") {
    onSpeech(data);
  } else if (kind === "room") {
    S.present = data.present || [];
    S.floor = data.floor !== undefined ? data.floor : S.floor;
    // THE INVITATIONS COME THIS WAY TOO. A field the escriba fills in
    // arrives seconds after the host's click and on nobody's request,
    // so there is no reply for it to ride; and this is what makes a
    // second tab, and the first one after a reconnect, agree.
    if (!S.guest && data.guests) S.guests = data.guests;
    renderGuest(); pttFace();
  } else if (kind === "closed") {
    // THE ROOM ENDED FROM THE OTHER SIDE: the host withdrew the
    // invitation or their session went away. Said in the server's own
    // words and then this page becomes its owner's own escriba again,
    // which is where somebody whose visit is over belongs.
    S.room = null; S.guest = false; S.host = "";
    S.guests = []; S.present = []; S.floor = null;
    raise("guest", { reason: data.reason || tx("guest.closed") });
    renderAll();
    connect();
  }
}

// One SSE response per turn, read off the POST rather than a second
// EventSource: the deltas belong to THIS turn and nobody else's.
async function readStream(res, sink) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      let kind = "message", payload = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) kind = line.slice(6).trim();
        else if (line.startsWith("data:")) payload += line.slice(5).trim();
      }
      if (payload) sink(kind, JSON.parse(payload));
    }
  }
}

let lost = null;
//: The live stream, held so it can be CLOSED. Entering or leaving a room
//: reconnects to a different hub, and an EventSource that was merely
//: dropped keeps delivering — two streams patching rows by id into one
//: transcript, which reads as the escriba answering itself.
let source = null;
function connect() {
  if (source) { try { source.close(); } catch (e) {} }
  const es = source = new EventSource(api("/events"));
  for (const kind of ["state", "entry", "counts", "items", "status", "alert",
                      "days", "wiki", "consumo", "closing", "speech", "closed",
                      "room"]) {
    es.addEventListener(kind, (m) => onEvent(kind, JSON.parse(m.data)));
  }
  es.onopen = () => {
    clearTimeout(lost); lost = null; S.everConnected = true;
    clearAlert("connection"); clearAlert("restarting");
    S.restarting = null;
  };
  es.onerror = () => {
    // The browser reconnects on its own; five seconds is the point at
    // which the silence stops being a blip and starts being a failure.
    // Nothing is said about a restart we were told about: the page is
    // already showing why, and tx("alert.lost") on top of it
    // would be a second, wrong explanation.
    if (lost === null && !S.restarting) {
      lost = setTimeout(() => raise("connection", { had: S.everConnected }), 5000);
    }
  };
}

// ------------------------------------------------------------------ mock
const MOCK_DOC = `# Riego por goteo en un balcón sin grifo

let mockTimer = null;
function mockPlay(e) {
  clearInterval(mockTimer);
  S.status = { status: "speaking", query: null };
  S.progSec = 0;
  paint(e); renderPills();
  mockTimer = setInterval(() => {
    S.progSec += 0.2;
    const r = rows.get(e.id);
    if (e.kind === "said" && r && r.prog) r.prog.style.width = (S.progSec / e.seconds) * 100 + "%";
    else paint(e);
    if (S.progSec >= (e.seconds || 5)) {
      clearInterval(mockTimer);
      S.playing = null; S.progSec = 0;
      paint(e);
      S.status = { status: "listening", query: null };
      renderPills();
    }
  }, 200);
}
function mockTurn(seconds) {

  const said = { id: Date.now(), at: now(), kind: "said", seconds, audio: "att_" + Math.random().toString(16).slice(2, 10), repeats: 1 };
  appendEntry(said);

// DRAW BEFORE CONNECTING.  Every region used to be rendered only by the
// hub's first `state`, so a page whose backend was not up showed an empty
// header and an empty knowledge column — indistinguishable from a broken
// build, when the truth was "nothing has connected yet".  The chrome is
// drawn from the empty state first: four pills with `escuchando` waiting,
// counts reading `—`, tabs at zero.  The alert then says what is wrong.
function renderAll() {
  applyTheme();                 // its label is a string like any other
  renderLangs(); renderPills(); renderCounts(); renderTabs(); renderPanel();
  renderDays(); renderTranscript(); renderEngines(); pttFace();
  renderGuest();
  // The static markup carries no Spanish any more, so the parts of the
  // chrome that are not redrawn by a renderer are set here.
  $("guest-btn").onclick = () => { S.inviting = !S.inviting; renderGuest(); };
  $("audit-btn").title = tx("header.ids.title");
  $("audit-btn").textContent = tx("header.ids");
  $("nav-head").textContent = tx("nav.days");
  $("nav-note").textContent = tx("nav.note");
  $("audio-in").textContent = tx("header.audio_in");
  $("jump").textContent = tx("jump.new");
}
applyTheme();
$("audit-btn").setAttribute("aria-pressed", String(S.showIds));
S.micReason = micUnavailable();

// THE CATALOGUE IS NEEDED BEFORE THE FIRST SNAPSHOT.  The page draws its
// whole chrome at load, deliberately — with no backend it used to render
// nothing at all — and an insecure-origin alert fires here, before any
// session exists.  So the strings are fetched first and everything is
// drawn once they are in hand.  The person's own locale arrives with the
// snapshot a moment later and replaces this one; until then the browser's
// preference is a better opening guess than the default.
function boot() {
  if (S.micReason) raise("insecure");
  renderAll();
  if (MOCK) {
  // The catalogue is FETCHED rather than inlined, so the mock page draws
  // the same strings the live one does and there is no second copy to
  // drift.  `?lang=en` previews another locale.  If the fetch fails —
  // the page opened from disk, with no backend behind it — it still
  // renders, showing keys, which is visibly unfinished rather than
  // silently Spanish.
    const want = new URLSearchParams(location.search).get("lang") || "es";
    fetch("strings/" + encodeURIComponent(want))
      .then((r) => r.json())
      .then((st) => onEvent("state", Object.assign(mockState(), { strings: st, locale: want })))
      .catch(() => onEvent("state", mockState()));
  } else {
    fetch("/invitacion")
      .then((r) => (r.ok ? r.json() : { rooms: [] }))
      .catch(() => ({ rooms: [] }))
      .then((d) => {
        S.invited = (d && d.rooms) || [];
        renderGuest();
        // NOT CONNECTED YET IF THEY WERE INVITED SOMEWHERE. `/events` is
        // what opens a person's own session — a consolidation pass, an
        // inventory prefetch and a greeting turn — and somebody standing
        // at another conversation's door has not asked for theirs. They
        // choose, and whichever they choose is the only one paid for.
        if (!S.invited.length) connect();
      });
  }
}

const wanted = MOCK ? (new URLSearchParams(location.search).get("lang") || "es")
                    : (navigator.language || "es").slice(0, 2);
fetch("strings/" + encodeURIComponent(wanted))
  .then((r) => r.json())
  .then((st) => { S.strings = st; S.locale = wanted; })
  // Rendering with no catalogue shows keys, which is visibly broken
  // rather than silently monolingual.  The page still comes up.
  .catch(() => {})
  .then(boot);
