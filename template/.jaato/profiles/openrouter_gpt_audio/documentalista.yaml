# documentalista — openrouter set: text only, and it has to write well.
name: documentalista
description: >
  Writes markdown documentation about one topic, from the second brain's
  memories and references and from nothing else. Spawned by the scribe on
  the person's request; reports the files it wrote.
inherits: [_base_documentalista]
plugins: []
model: openai/gpt-4o-mini
provider: openrouter
plugin_configs:
  openrouter:
    # THE PROVIDER'S OWN KNOB, and the key never lands in a workspace: the
    # daemon resolves `pass://` during profile resolution, so what sits
    # here — and so in every person's provisioned copy of it — is a
    # POINTER, not a secret.
    #
    # It cannot be the usual `~/.jaato/openrouter_auth.json`: a root daemon
    # drops this session's runner to the workspace's owner
    # (`--runner-uid-policy workspace-owner`), and a dropped runner's `~`
    # is THAT account's home, so the daemon's own credential file is out of
    # reach by design.  A workspace `.env` would reach it — and would put a
    # live key in every person's directory.
    #
    #
    # `jaato/` AND NOT `escriba/`, DELIBERATELY.  The host's provider keys
    # are shared and centralised: one entry serves every tenant on the
    # box, and this application is one of them rather than the owner of a
    # key.  The alternative was a per-application entry, and the cost of
    # not having one is known and accepted — rotating the shared key stops
    # every tenant at once, and a spend anomaly on the provider's bill
    # cannot be attributed to a tenant from the key alone.  Recorded here
    # so the name does not get "tidied" into a per-app one by somebody
    # reading this file without that context.
    # Create it once on the host:  pass insert jaato/openrouter/api-key
    api_key: pass://jaato/openrouter/api-key
    api_params:
      # Prose, not a verdict: a little room is right here, unlike the
      # judge and the curator which are pinned at 0.
      temperature: 0.3
