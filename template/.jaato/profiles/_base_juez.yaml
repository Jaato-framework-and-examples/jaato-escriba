# Tier-1 base for 'juez' — PROVIDER-AGNOSTIC.
name: _base_juez
description: >
  Decides whether some search results are about the topic. One turn, one
  verdict, and it is done.
plugins:
  # ONE tool, eagerly.  The judge used to decide from the title and the
  # snippet alone, having opened nothing — so a dead link or a page that
  # is not what its snippet claims got catalogued and then offered to a
  # person mid-conversation.  Fetching what it is about to accept both
  # verifies the page exists and lets it say what is actually in it.
  #
  # `tools:[web_fetch]` drops the plugin's other surface; the judge has no
  # business doing anything else.
  - "web_fetch(mode:preload, tools:[web_fetch])"
# One turn by design: fetch a handful of URLs, accept or discard. The
# ceiling is deliberately tight — anything more means it is re-judging.
budget_control:
  limits:
    usd: 0.30
    turns: 25
    tool_calls: 60
    seconds: 240
  degrade:
    - at: 80
      action: finalize
    - at: 100
      action: abort

suppress_base_instructions: true
# It DOES declare a schema, unlike the conversational profiles, and that
# is correct: this session is single-turn and terminating is exactly its
# job, so jaato#913 never bites it.
completion_payload_schema: completion_schemas/juez.json
plugin_configs:
  permission:
    policy:
      defaultPolicy: deny
      whitelist: {tools: [web_fetch]}
  web_fetch:
    # A summary needs the top of the page, not the whole of it: the judge
    # reads several of these in one turn and the context is not free.
    max_length: 6000
    timeout: 15

completion_processors:
  # Reconciles the verdict against the candidates it was handed: every URL
  # in one list and only one.  Without this, returning two accepted and
  # saying nothing about the rest validates just the same and looks like
  # finished work.
  - script: scripts/processors/all_judged.py
    name: all_judged
    on_error: fail_completion
    max_refusals: 3
    on_exhausted: allow

# ---------------------------------------------------------------- isolation
# Kernel-enforced confinement, per session.  OFF BY DEFAULT in the
# framework (`apparmor` defaults to False), so every session this project
# ever ran was unconfined until now.
#
# This matters more here than in a single-user tool: each person gets their
# own workspace under one root, and a `documentalista` writing on their
# behalf must not be able to read the person in the next directory along.
# The workspace is the isolation boundary (`explain paths`); this is what
# makes the kernel agree.
apparmor: true
# EMPTY ON PURPOSE, which is not the same as absent.  Absent (`None`)
# composes EVERY fragment on the search path — and that path includes the
# shared `~/.jaato/apparmor-fragments/`, which on this host holds
# `jaato-kb-enablement-2.rules` and `premium-reactor.rules`: other
# projects' grants, which would silently widen these sessions.  `[]` takes
# the framework's base policy and adds nothing.
apparmor_fragments: []
