# Tier-1 base for 'escriba' — PROVIDER-AGNOSTIC.
# Model and provider live in profiles/<set>/escriba.yaml.
name: _base_escriba
description: >
  Interviews the user by voice and entrusts what it learns to memory.
  It is resident: it wakes up knowing what it was told last time.

# IT DOES declare a completion_payload_schema, and that is new: until
# jaato#913 and #845 landed (2026-09-09) it could not.
#
# Declaring it enables `signal_completion`, and calling it used to leave
# the session unusable: the answer was never written into history, so the
# next turn replayed a `tool_call` with no response and the provider
# rejected it with a 400.  On top of that, neither resume verb carried an
# attachment, so a voice session that completed could never be spoken to
# again.  Both are fixed (#915, #914), and both were verified here before
# this was turned on: three consecutive completions on one session, and a
# completed session woken with an audio attachment.
#
# WHY COMPLETE EVERY TURN.  It is the only thing that makes the scribe
# write.  The persona asked it to and it did not — measured, 0 tool calls
# across 5 turns and 5.6 minutes of real conversation, because an audio
# model announces a tool instead of invoking it.  A completion processor
# reads the tool-call ledger, which the model cannot rewrite, and refuses
# the turn if nothing was stored.  Prose is a suggestion; a gate is a
# contract.
#
# It costs almost nothing: measured 1.40 s per turn with completion
# against 1.30 s without, because the session stays warm rather than
# cold-restarting.
# Nudges are PER TURN since jaato#934 (fixed in #936), so this is a retry
# allowance for one turn rather than a ceiling on the conversation.
#
# It had to be 40 while the budget was per session: this model never calls
# `signal_completion` unprompted — it finishes speaking and considers the
# turn done — so one nudge went on every turn and the conversation died at
# turn N+1.  Verified after the fix: six turns all close with the budget
# at 2.
#
# 3, not the default 2: one nudge is spent on the ordinary "you have not
# closed the turn" prompt, and the spare covers a turn where the
# `wrote_something` gate rejects once and the model has to fix its payload.
max_completion_nudges: 3

completion_payload_schema: completion_schemas/escriba.json
completion_processors:
  # Refuses a turn that stored nothing and did not say why.
  - script: scripts/processors/wrote_something.py
    name: wrote_something
    on_error: fail_completion
    max_refusals: 2
    # `allow`: after two refusals the turn stands.  The alternative is
    # blocking a spoken conversation on a memory, and a person waiting in
    # silence for a second brain to satisfy its own bookkeeping is worse
    # than a memory lost.
    on_exhausted: allow

plugins:
  # Only TWO tools, and eagerly.
  #
  # `mode:preload` puts them in the initial schema so a spoken turn never
  # spends a round trip on `list_tools`.  `tools:[...]` leaves the
  # plugin's other three out — and that matters here for a reason it
  # would not in a text agent: every tool in the schema is a name this
  # model may read OUT LOUD.
  - "memory(mode:preload, tools:[store_memory, retrieve_memories])"
  # The catalogue of what has been found outside.  Loaded so that
  # `enrich_tool_result` injects hints for references whose tags match the
  # result of `store_memory` — which is what carries the tags.  That way
  # the reference appears in front of the scribe exactly while it is
  # writing about that topic, without anyone having to ask for it.
  #
  # TWO tools, via `tools:[...]` and not via the whitelist: the plugin
  # marks all FOUR as auto-approved (references/plugin.py:4356), and an
  # auto-approved tool bypasses the policy.  Subsetting is the only thing
  # that keeps `validateReference` and `compute_embedding` out.
  - "references(mode:preload, tools:[listReferences, selectReferences])"
  # Para poder LEER una referencia cuando la persona dice que sí.  Sin
  # esto el escriba puede ofrecerla y nada más: `selectReferences`
  # autoriza la URL, no la abre.
  #
  # Una sola herramienta del plugin, por la razón de siempre: cada nombre
  # del esquema es una palabra que el tier de voz puede leer en alto.
  - "web_fetch(mode:preload, tools:[web_fetch])"
  # To hand a documentation request to the `documentalista`, which runs in
  # the BACKGROUND — so asking for a document does not stop the
  # conversation.  Two tools: spawn it, and check whether it is still
  # going.  Not `close_subagent` or `cancel_subagent`: it finishes on its
  # own, and a voice model with a cancel button is a way to lose work.
  - "subagent(mode:preload, tools:[spawn_subagent, list_active_subagents])"
  # Declared for the SUBAGENT's sake, not its own. A subagent shares the
  # parent's PluginRegistry, so the permission plugin the documentalista
  # meets is THIS session's instance — configured from this profile.
  # Measured: documentalista writes fine as a direct session and not at
  # all as escriba's subagent, because the whitelist lived on the child's
  # profile and the plugin answering was the parent's.
  # This grants escriba nothing: `file_edit` is not in its plugin list at
  # all, so it has no write tool to approve. The subset stays the boundary.
  - "permission(mode:preload)"

# Drop the instruction layers the framework injects.  This agent
# converses; the platform constants (task-completion, parallel batching,
# turn summaries) describe work it does not do — and an audio model pays
# for that prompt on EVERY turn.
# The person is in the room and the conversation is open-ended, so the
# ceiling is generous — but `turns` is what stops a tier ping-pong and
# `usd` is what stops a bad night costing real money.
budget_control:
  limits:
    # REAL MONEY, and the audio tier is where it goes: `voz` is
    # openai/gpt-audio, every utterance stays in history as base64 and is
    # re-sent on all later turns, so the cost of turn N grows with N.
    # Measured on this deployment: ~10k prompt tokens by the fourth turn.
    # 10.00 is a working session, not a licence — the ladder below still
    # aborts at 100 %.
    usd: 10.00
    turns: 120
    tool_calls: 400
    # SUMMED TURN WALL-CLOCK ACROSS THE SESSION, not per turn. The
    # framework's own words (`budget_control.py:71`): "seconds -> summed
    # turn / tool wall-clock". This was 90, with a comment reasoning
    # about "a plausible long turn" — which read the dimension as
    # per-turn and was simply wrong. At ~20 s for an audio turn it ended
    # every conversation at the fourth or fifth message, which is how it
    # was found: by somebody being cut off mid-conversation.
    #
    # 3600 is an hour of actual turn time, which is a long conversation
    # and not an unbounded one; the person's own thinking and talking is
    # not in it, so an hour here is several hours at the microphone.
    #
    # WHAT THIS GIVES UP, said plainly: the 90 did catch the 2026-09-11
    # pathology — one turn, 90 tool calls, 83 identical memories, 179
    # seconds. Nothing per-turn replaces it, because the framework has no
    # per-turn wall-clock dimension: `runtime_limits` caps a TOOL's
    # wall-clock, and every `budget_control` dimension is cumulative. So
    # a runaway turn is now caught by `tool_calls` instead, which that
    # turn would have hit in four of its own kind.
    seconds: 3600
  degrade:
    - at: 80
      action: finalize
    - at: 100
      action: abort

suppress_base_instructions: true

# A conversation accumulates audio in a way a text one does not: every
# utterance stays in history as base64 and is re-sent on ALL later turns.
# Audio that has already been answered is worth nothing — the
# conversation carries the meaning — so old turns are exactly what should
# be dropped.
gc:
  type: budget
  threshold_percent: 60.0

plugin_configs:
  # NO TELEMETRY FROM A PERSON'S SECOND BRAIN.
  #
  # The daemon on the deployed host loads another tenant's environment
  # file (the Telegram bot's), which sets JAATO_TELEMETRY_ENABLED=true,
  # the langfuse backend, cloud.langfuse.com — and
  # JAATO_TELEMETRY_REDACT_CONTENT=false, against a framework default of
  # true.  Every runner inherits it, so these sessions have been trying
  # to export prompts and responses, unredacted, to a third party's
  # cloud, and have failed only because the Langfuse keys live in that
  # other tenant's workspace.  The exposure is one credential away, and
  # what would go is a person's private conversation with their own
  # second brain.
  #
  # Declared HERE rather than in the workspace `.env` for two reasons the
  # framework states itself: the profile block outranks the `.env` per
  # key (`explain env`), and `.jaato/profiles/` is on the AppArmor
  # write-deny list while everything in the workspace is writable by the
  # session.  The opt-out therefore cannot be undone by the thing it
  # constrains.
  telemetry:
    enabled: false
  memory:
    # The second brain has its OWN memory, and both paths say so.
    #
    # `storage_path` is the workspace tier; `global_storage_path` is the
    # cross-session tier, which by default points at
    # `~/.jaato/memories.jsonl` — the whole machine's store, shared with
    # the ~40 neighbouring repos.  Redirecting it here is what stops the
    # scribe reading, judging or touching memories that are not its own.
    #
    # It is needed because `allowed_scopes` does not do this: it applies
    # only on write (memory/plugin.py:1064).  Neither `retrieve_memories`
    # nor `update_memory` consults it, so without redirecting the global
    # path the curator reached the user's personal memories — and on the
    # first run it deleted three.
    #
    # CAVEAT: `global_storage_path` is documented as a "for testing" knob
    # (plugin.py:308).  It is a declared option and it is read from
    # config, but if a future version drops it this separation is lost
    # silently.
    #
    # DIRECTORIES, not files.  `MemoryStorage` accepts a `.jsonl` for
    # compatibility but treats it as a ROOT: `x.jsonl` becomes the
    # directory `x/` with `raw/` and `curated.jsonl` inside, and the loose
    # file is ignored without migration (storage.py:250-270).  Naming the
    # directory avoids that silent translation.
    # THE PLUGIN'S OWN DEFAULT PATH, so this tracks the plugin instead of
    # a name of ours.  It was `.jaato/memory/escriba`.
    #
    # NOT for the reason first recorded here: that said a confined runner
    # is granted a fixed list of `.jaato/` subpaths and an invented one is
    # denied.  That was wrong, and checking the rendered AppArmor template
    # (jaato-server 1.3.0rc9) is what showed it: the base body grants
    # `{workspace}/** rwkl` and then write-denies a FIXED LIST —
    # agents, profiles, scripts, completion_schemas, spawn_schemas,
    # instructions, references, templates, plans, reactors.json,
    # permissions.json, apparmor-fragments.  Anything NOT on that list is
    # writable, invented or not.  `.jaato/memory/escriba` would have
    # worked.  Using the default is still better — it is one less name of
    # ours to keep in step — but the denial story was fiction.
    storage_path: .jaato/memories
    # AND THE GLOBAL TIER MUST STAY INSIDE THE WORKSPACE, which matters
    # more here than it did as a single-user tool.  Its default is
    # `~/.jaato/memories.jsonl`, and the deployed daemon drops each runner
    # to the workspace's OWNER — one account for all of this tenant's
    # people.  So `~` is that one account's home, and the default would
    # give every person of this tenant ONE shared global store: person A's
    # memories retrievable by person B.
    #
    # `allowed_scopes` below is the PRIMARY gate and the framework now
    # documents it as such — "Write-side gate: which memory scopes the
    # model may store … Set e.g. [\"project\"] to keep a deployment off
    # the HOME/global tier entirely".  Its default is permissive
    # (`['project', 'universal']`), which is exactly how a deployment
    # ends up with one shared HOME store per tenant without choosing to.
    #
    # This path is the BACKSTOP, and the two are deliberately independent:
    # the gate decides what the model may write, this decides where such a
    # write would land if the gate were ever relaxed.  Neither relies on
    # the other.
    global_storage_path: .jaato/memories-global
    # 'project' only.  A 'universal' memory auto-injects into EVERY jaato
    # session on this machine, the ~40 neighbouring repos included.  The
    # second brain is consulted by talking to it, not by polluting every
    # other agent's prompt.
    allowed_scopes: ["project"]
  web_fetch:
    # Read out loud, eventually: a wall of page is no use to someone
    # listening, and it would sit in history for the rest of the talk.
    max_length: 6000
    timeout: 15
  permission:
    # A spoken call has nowhere to show a permission prompt and nobody to
    # click it.  Unanswered, the turn simply stops: the session goes quiet
    # with no error.  Explicit whitelist.
    policy:
      defaultPolicy: deny
      whitelist:
        tools:
          - store_memory
          - retrieve_memories
          # The tier switch itself.  A denied `enter_tier` would strand
          # the voice tier holding something to write and no way to write
          # it.
          - enter_tier
          - web_fetch
          - spawn_subagent
          - list_active_subagents

# ---------------------------------------------------------------- isolation
# Kernel-enforced confinement, per session.  OFF BY DEFAULT in the
# framework (`apparmor` defaults to False), so every session this project
# ever ran was unconfined until now.
#
# This matters more here than in a single-user tool: each person gets their
# own workspace under one root, and a `documentalista` writing on their
# behalf must not be able to read the person in the next directory along.
# The workspace is the isolation boundary (`explain paths`); this is what
# makes the kernel agree.
apparmor: true
# EMPTY ON PURPOSE, which is not the same as absent.  Absent (`None`)
# composes EVERY fragment on the search path — and that path includes the
# shared `~/.jaato/apparmor-fragments/`, which on this host holds
# `jaato-kb-enablement-2.rules` and `premium-reactor.rules`: other
# projects' grants, which would silently widen these sessions.  `[]` takes
# the framework's base policy and adds nothing.
apparmor_fragments: []

# ----------------------------------------------------------------- audit
# WHERE THE RECORD LANDS, and why this profile of the four needs it.
#
# This is the agent that talks to the person, so it is the one the Art.
# 50(1) announcement is written for — and the row is written by the
# DAEMON at session creation, into `trace.ledger`.  With no ledger
# configured `explain audit` is explicit about the outcome: the row "is
# held in memory and never reaches disk — announced at WARNING, and
# `validate` reports the profile as disclosure_unrecorded (#1157)".  So
# the ledger exists BEFORE anything declares `interacts_with_persons`,
# or the person is told and the telling is not recorded.
#
# Workspace-relative, so it lands in THIS person's tree. The default
# would interleave every person on the host into one file.
trace:
  ledger: .jaato/logs/ledger.jsonl
  session_log: .jaato/logs/{agent}/session.log

# HOW LONG THE TWO HALVES ARE KEPT (Arts. 12, 19, 26(6)).
#
# `retention_days: 180` is Art. 19(1)'s own figure — the provider keeps
# the logs at least six months, and 26(6) asks the same of the deployer.
# It is a floor, not a preference, which is why it is the one number here
# that needed nobody's opinion.
#
# `conversation_retention_days: 60` is the provider's own policy — how
# long a person's recorded voice is kept — and it is SHORTER than the
# audit clock on purpose: the record of what the system did outlives the
# personal data it did it to, which is what satisfies Art. 19(1) and a
# GDPR erasure request at once.
#
# It is also a FLOOR THAT BITES.  `housekeeping` reads both clocks out of
# the session's sealed snapshot, and inside this one it will not delete
# for the disk ceiling: it reports the shortfall and exits non-zero
# instead.  At 200 MB a person holds roughly one to two hours of
# conversation (model speech is 48 KB/s against the person's 4 KB/s), so
# a daily user reaches the ceiling well before 60 days and the sweep
# starts saying so rather than quietly dropping the oldest week.  That is
# the designed outcome: the two numbers answer to different authorities,
# and a disagreement between them is a person's decision, not a
# housekeeping pass's.
record_keeping:
  retention_days: 180
  conversation_retention_days: 60

# If telemetry is ever turned on for this application deliberately, it
# starts from the framework's own default rather than the host's: the
# daemon's inherited environment sets redaction to false, and a second
# brain is the last thing that should export its content verbatim.  This
# costs nothing while telemetry is off and is the difference between a
# leak and a trace if it is ever switched on.
env:
  JAATO_TELEMETRY_REDACT_CONTENT: "true"
