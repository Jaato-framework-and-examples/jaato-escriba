# What this project needs, said once, so a second machine cannot guess.
#
# There was no manifest here until a clone on another host resolved
# `jaato-sdk` freely, landed on 0.19.0, and every session was refused with
# `SessionInitializationError` — no cause attached, because the detail only
# ever reaches the client as an uncorrelated event.  The cause was an
# import: `jaato-server` 0.14.0 reads `reported_cache_count` from the SDK,
# which exists only from 0.21.0.  Nothing in any metadata said so
# (jaato#1055), and nothing in this repo said so either.  This file is the
# half that was ours to fix.

[project]
name = "jaato-escriba"
version = "0.1.0"
description = "One person's second brain. It asks out loud, and next time it remembers what it was told."
readme = "README.md"

# EXACTLY 3.12, and both ends are somebody else's requirement.
#
# Floor: `jaato-sdk` 0.30 supports >=3.12, and that is the SDK line the
# daemon runs (server 1.3.0).  The resolver is what said so.
#
# Ceiling: `audioop` is imported at `ptt_capture.py:51` and was REMOVED
# from the standard library in 3.13 (PEP 594).  That module is vendored
# from `jaato-cascade-audio-interchange`, so the constraint is declared
# rather than worked around — a resolver error naming Python beats an
# ImportError at the first press of the microphone key.  To lift it, add
# `audioop-lts` for 3.13+ and test the recorder.
requires-python = ">=3.12,<3.13"

dependencies = [
    # `enrichment.py:49` imports it inside `_search`, so the app starts
    # without it and the FIRST search fails with ModuleNotFoundError —
    # which is how it was found, in a note on a live transcript. The same
    # hole pyproject.toml exists to close: a dependency the code imports
    # and the manifest does not name.
    "ddgs>=9.16.0",
    # This is a FLOOR WITH A REASON, not a snapshot of what happened to
    # be installed.  Three of them:
    #   - `jaato-server` imports `reported_cache_count` (added in SDK
    #     0.21.0, commit 8e6f0182) from seven model providers, and declares
    #     no floor of its own — see jaato#1055.  A resolver that picks an
    #     older SDK is obeying the metadata; the metadata is what is wrong.
    #   - the profiles in `.jaato/` depend on framework fixes found from
    #     this project: jaato#944 (allow_inline), #950 (plugin_configs
    #     reachability), #955, #957, #961 (the explicit `{agent}` trace
    #     form).  An older framework rejects them at session init.
    #   - rc7 is the first SDK cut carrying `PLUGIN_TOOL_REQUEST_TYPES`,
    #     which `jaato-server` imports from `jaato_sdk.events` at MODULE
    #     level (`server/ipc.py:109`, jaato#1606, protocol 1.37).  rc6
    #     does not have it, and `jaato-server` 1.3.0 declares only
    #     `jaato-sdk>=0.30.0.dev0`, which rc6 satisfies — so a resolver
    #     will pair them and the daemon then fails to import its own IPC
    #     transport.  Reproduced against the published rc6 wheel:
    #     `ImportError: cannot import name 'PLUGIN_TOOL_REQUEST_TYPES'`.
    #     The framework declines to raise that floor on purpose (jaato
    #     #1153: a floor at the cut's final excludes every build on the
    #     staging index), so naming the working SDK is OUR job.
    "jaato-sdk>=0.30.0rc7",
    # `memory.py:25` reads the curated store.
    "PyYAML>=6.0",
]

# WHERE THE FRAMEWORK COMES FROM, and why not PyPI.
#
# The releases that matter are staged on TestPyPI as PRE-RELEASES (jaato
# #1029), so PyPI's "latest" lags: it answers 0.21.0 for the SDK and 0.14.0
# for the server while the daemon this talks to runs 1.3.0.  Resolving
# against PyPI therefore installs an SDK older than the daemon and the
# mismatch surfaces as an unrelated-looking provider ImportError
# (jaato#1055).
#
# Only `jaato-sdk` is pinned to that index.  Making TestPyPI the primary
# index would resolve `rich` and `PyYAML` there too, where they are
# mirrors at best — so the third-party dependencies stay on PyPI.
[tool.uv]
prerelease = "allow"          # the rc line IS the release line here

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true               # used only for what names it below

[tool.uv.sources]
jaato-sdk = { index = "testpypi" }
jaato-server = { index = "testpypi" }

[project.optional-dependencies]
# Only `--tui` draws, and `richboard` is imported inside that branch
# (`run_escriba.py:346`), never at module scope.  So the plain line-mode
# driver runs without `rich`, and saying so here keeps that true.
tui = ["rich>=13.0"]

# The web front end's backend: the only SDK client, serving one static
# page.  `python-multipart` is not optional decoration — FastAPI needs it
# to accept the recording the browser uploads, and without it the upload
# fails at request parsing with a message about the wrong thing.
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

# Transcribing the PERSON's half, locally, from the mp3 already archived.
#
# OPTIONAL AND OFF BY DEFAULT, because it is the heaviest thing this
# project can install: ~17 packages (ctranslate2, av, onnxruntime) plus a
# model downloaded on first use — `tiny` ~75 MB, `base` ~145 MB, `small`
# ~480 MB.  On a host with 2 GB free, competing with 200 MB of
# recordings per person, the model is a choice somebody makes and not a
# default anybody inherits: `--transcribe <model>` names it or nothing
# runs.
stt = ["faster-whisper>=1.2"]

# THE DAEMON IS A SERVICE, NOT AN IMPORT.  This project is a client: it
# imports `jaato_sdk` and talks to a daemon over `/tmp/jaato.sock`, which
# may well live in another environment entirely.  Install this extra only
# when the daemon runs from THIS virtualenv — and if it does, these are the
# extras the profiles here actually require:
#   - `openrouter` -> `openai`, or the model loop raises ImportError on the
#     first turn (the provider is loaded lazily, so init succeeds first).
#   - `web`        -> trafilatura/html2text/beautifulsoup4, for the
#     `web_fetch` plugin the scribe and the juez both declare.
# Everything else the profiles use — memory, references, subagent,
# permission, file_edit — is core `jaato-server` and needs no extra.
#
# Moved to rc10 for jaato#1605 — a subagent now inherits the secret its
# parent resolved, which is what the documentalista spawn needs: the
# provider key is a `pass://` pointer, and resolving it runner-side under
# confinement fails.  The SDK floor above moves in the SAME step, and not
# as tidiness: see its third bullet.
daemon = ["jaato-server[openrouter,web]>=1.3.0rc10"]
