# Tier-1 base for 'documentalista' — PROVIDER-AGNOSTIC.
name: _base_documentalista
description: >
  Writes markdown documentation about one topic, from the second brain's
  memories and references and from nothing else. Spawned by the scribe on
  the person's request; reports the files it wrote.

plugins:
  # Read the brain, read what was found outside, write files. Nothing else.
  #
  # Subset per plugin rather than a permission whitelist: `memory` and
  # `references` mark their tools auto-approved (plugin.py:740 and :4356),
  # and an auto-approved tool bypasses the policy — so the whitelist is not
  # a boundary here. `tools:[...]` is. It has bitten this repo three times.
  - "memory(mode:preload, tools:[retrieve_memories, list_memory_tags])"
  - "references(mode:preload, tools:[listReferences, selectReferences])"
  - "web_fetch(mode:preload, tools:[web_fetch])"
  - "file_edit(mode:preload, tools:[writeNewFile, updateFile, readFile])"
  # Declared for its CONFIG, not its tools: get_tool_schemas() returns []
  # (plugin.py:725 — askPermission is deliberately not exposed), so this
  # adds no tool surface. Without the declaration the profile's
  # plugin_configs.permission never reaches the plugin and the whitelist
  # below is inert — measured: 55 ASKs on a pre-approved tool.
  - "permission(mode:preload)"

# The persona belongs to the profile, not to every caller (#944). With this,
# `spawn_subagent(profile="documentalista")` yields a subagent that has both
# the tools AND the instructions — the scribe cannot get the pair half-right.
default_agent: documentalista

# Writes a document tree and reports. `tool_calls` is the load-bearing
# one here: on 2026-09-10 this agent called writeNewFile 35 times in five
# minutes against a file_edit that had failed to initialise, and nothing
# stopped it — the session had to be killed by hand.
# One tool at a time. Measured 2026-09-10: this agent emitted three
# selectReferences calls in a single turn, two of them byte-identical. The
# first selected; the second was told "no sources matched criteria" because
# its twin had just done the work — and the model read its own race as a
# failure and retried 192 times. `max_parallel_tools` is the one
# runtime_limits field an in-process subagent can honour (#862).
runtime_limits:
  max_parallel_tools: 1

budget_control:
  limits:
    usd: 0.60
    turns: 50
    tool_calls: 100
    seconds: 600
  degrade:
    - at: 80
      action: finalize
    - at: 100
      action: abort

# Both logs, workspace-relative so they land in THIS tree. The global
# /tmp/rich_client_trace.log interleaves every workspace on the machine —
# diagnosing a writeNewFile failure there meant reading another project's
# session at the same timestamps.
trace:
  # `{agent}` is the EXPLICIT form (#961): substituted wherever it appears,
  # `main` for the parent and `subagent_1`… for each spawned child. Under
  # the implicit form — a plain path, agent id appended before the
  # extension — the provider log split per agent but the session log did
  # not, so the parent's lines and the documenter's shared one file and
  # every query had to be filtered by the `agent=` field to mean anything.
  # Measured: `subagent_1/session.log` holds ONLY this agent's lines, which
  # is the view that was being filtered for. `main/session.log` still carries
  # some of the child's too — a superset, not a clean split — so read the
  # child's own file when the child is the question.
  session_log: .jaato/logs/{agent}/session.log
  provider_log: .jaato/logs/{agent}/provider.log

suppress_base_instructions: true

# It reads memories, fetched pages and its own drafts: the context fills up
# fast and the older halves of a long document are not needed to write the
# next page.
gc:
  type: budget
  threshold_percent: 70.0

completion_payload_schema: completion_schemas/documentalista.json
completion_processors:
  # What it claims it wrote must be on disk, the tree must hang together,
  # and every cited id must exist. See the module docstring for why the
  # fourth check is the one that matters.
  - script: scripts/processors/docs_are_real.py
    name: docs_are_real
    on_error: fail_completion
    max_refusals: 3
    on_exhausted: allow

plugin_configs:
  memory:
    # Same store as the scribe — it is documenting THAT brain — and the
    # same reason for redirecting the global tier: see _base_escriba.
    storage_path: .jaato/memory/escriba
    global_storage_path: .jaato/memory/escriba-global
    # Read-only in practice: `store_memory` is not in its tool list. The
    # gate is here too so a future edit cannot quietly grant it.
    allowed_scopes: ["project"]
  file_edit:
    # An explicit backup dir: file_edit refuses to initialise without one
    # when no config_root is set, and the failure is a plugin that simply
    # is not exposed — observed on another profile in this workspace.
    backup_dir: .jaato/backups
  web_fetch:
    max_length: 8000
    timeout: 15
  permission:
    # `writeNewFile` is NOT auto-approved (file_edit exposes only readFile,
    # undoFileChange, restoreFile, listBackups as such), so the policy
    # resolves to ASK — and a headless API session has no channel to ask.
    # Measured: the ASK returned no decision at all, the write never
    # happened, and the model retried every 1.5s until it was killed.
    #
    # The whitelist names the two write tools this agent already has via
    # `tools:[...]`; it grants nothing the tool subset has not granted.
    # The subset stays the real boundary — a whitelist cannot widen it.
    policy:
      # deny, not ask. `ask` routes an unmatched tool to an approval
      # channel, and a headless driver has none — the call then neither
      # runs nor refuses, and the model, given no error to react to,
      # re-issues it. That is the silent retry loop this workspace has
      # already paid for once. `deny` is deterministic, is the library's
      # own default (config_loader.py:19), and produces a refusal the
      # model can actually see.
      defaultPolicy: deny
      whitelist:
        tools: [writeNewFile, updateFile]
