# curator — openrouter set: text only, and good at calling tools.
name: curator
description: >
  Judges what the scribe wrote down raw: validates it or lets it go.
  It is what makes "remembering" true — without it the raw queue is
  reachable by no tag search, and the next session wakes up with nothing.
inherits: [_base_curator]
plugins: []  # empty keeps the surface inherited from _base_curator
model: openai/gpt-4o-mini
provider: openrouter
plugin_configs:
  openrouter:
    api_params:
      # Here it is fine: the curator is a text model, it does not carry
      # the audio model's defect, and its job — the same verdict for the
      # same memory — is exactly where determinism is worth something.
      temperature: 0.0
