# escriba — openrouter set: hears and speaks with openai/gpt-audio.
name: escriba
inherits: [_base_escriba]
plugins: []  # empty keeps the surface inherited from _base_escriba

# NO top-level `model:` or `provider:`: both tiers declare them in full,
# and since jaato#822 that is enough.
#
# `runner_spawn.py:455-464` documents the chain — profile.provider ->
# `model_tiers[initial].provider` -> `session_env["JAATO_PROVIDER"]` — and
# the fix's own comment says deriving from the initial tier "is what makes
# that advice true", referring to the validator hint that suggests
# dropping them.  Before that fix a tiers-only profile died with
# `envelope.provider_name is empty`, which surfaced client-side as a 60 s
# timeout; not any more.

# TWO TIERS, because speaking and using tools want different models.
#
# A tier carries a model, a provider, modalities and an exit rule — NOT
# tools.  The tool schema is session-wide and lives in the prompt-cache
# prefix, so both tiers see `store_memory`; what the tier changes is WHICH
# MODEL is at the wheel when the decision to call it is made.  And there
# is the reason: an audio model ANNOUNCES the tool instead of invoking it
# — measured in the reference repo, it said «voy a abrir el parte» and
# called nothing.  No persona wording turns a weak tool-caller into a
# strong one.
#
# The session STARTS in `voz` because the input is audio: a text model
# cannot hear the user, so it cannot be the tier the utterance arrives at.
model_tiers:
  # The only tier that is heard.  `bidirectional` is not two roles bolted
  # together: outbound makes the daemon ask for `modalities: [text, audio]`
  # on the request, and inbound is what lets an `audio/*` attachment reach
  # the wire as an `input_audio` block instead of being withheld
  # (jaato#830).  Declaring only outbound would leave it speaking into a
  # room it cannot hear.
  voz:
    # The FULL gpt-audio, not `-mini`, and the reason is the accent.  The
    # mini speaks Latin American Spanish and cannot be moved off it: six
    # voices and an explicit instruction naming Madrid, castellano and the
    # c/z distinction all produced the same seseo.  The full model does
    # produce peninsular Spanish with that same instruction.
    model: openai/gpt-audio
    provider: openrouter
    modalities: {audio: bidirectional}
    # Spanish: the description renders verbatim into the `enter_tier`
    # schema, so this is what the model reads when deciding where to go.
    description: 'el único tier que el usuario oye; entra aquí para decir cualquier cosa en voz alta'
  # Entered to write into memory, and left again on its own.  `exit_on:
  # completion` means ONE completion here and control returns, without the
  # entered model having to hand it back — which is exactly what the audio
  # tier never did unprompted across four measured runs.
  #
  # Not named `planner`: that is one of the four canonical names and
  # carries the framework's own meaning, "decides the answer and closes
  # the session", which is the opposite of this job.
  escribano:
    model: openai/gpt-4o-mini
    provider: openrouter
    exit_on: completion
    # La descripción se renderiza LITERAL en el esquema de `enter_tier`, así
    # que es lo que el modelo lee al decidir a dónde va — y decía «para
    # decir algo, vuelve a voz», que es una invitación a pedir la vuelta
    # que `exit_on: completion` ya le da hecha.  Medido: el 74 % de los
    # `enter_tier(voz)` volvían "already_at_tier"; con la regla en la
    # persona bajó al 30 %, y el 30 % restante lo pedía esta frase.
    description: 'anota y consulta lo aprendido; AQUÍ NO SE OYE. Al terminar vuelves a voz TÚ SOLO: no pidas volver, ya estás de vuelta'
  initial: voz
  fallback: voz

plugin_configs:
  openrouter:
    framework_overrides:
      # ASSERTS what the model may emit.  No catalogue in the tree reports
      # output modalities, so without this the floor stays text-only and
      # the tier's outbound role is REFUSED at startup.
      output_modalities: [text, audio]
    api_params:
      # NO `temperature`, and that is deliberate rather than an omission.
      # The scaffold writes `temperature: 0.0` as a determinism knob; on
      # this model it causes catastrophic looping — 818 s of speech
      # measured for a one-sentence answer.
      audio:
        voice: marin
        format: pcm16
