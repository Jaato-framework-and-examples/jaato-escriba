# Tier-1 base for 'curator' — PROVIDER-AGNOSTIC.
name: _base_curator
description: >
  Judges what the scribe wrote down raw: validates it or lets it go.
  It is what makes "remembering" true — without it the raw queue is
  reachable by no tag search, and the next session wakes up with nothing.

# It declares no completion_payload_schema, like the scribe, and for a
# different reason: it is a FACULTY, not a service that gets called.  It
# cannot decide it is finished.  Withholding the schema is what removes
# `signal_completion` entirely.
#
# It neither speaks nor hears: there are no tiers or modalities here.  The
# thing that judges the memories is not the thing that writes them.

plugins:
  # THREE tools, and nothing else EXISTS in this session.
  #
  # `mode:preload` because `update_memory` is DEFERRED behind discovery —
  # a curator that has to call `list_tools` before it can validate
  # anything spends its first turn looking for its own hands.
  #
  # `tools:[...]` is the part that matters: it leaves `store_memory` and
  # `delete_memory` out of the whole registry, not just out of the
  # permission policy.  That is necessary because the whitelist does NOT
  # reach `store_memory`: the plugin marks it auto-approved
  # (memory/plugin.py:740) along with `retrieve_memories` and
  # `list_memory_tags`, and an auto-approved tool bypasses the policy.
  # `delete_memory` was blocked only because it is not on that list —
  # luck, not design.
  #
  # Measured 2026-09-09: with `store_memory` within reach, the curator
  # discarded a good memory and stored it again raw with `content` and
  # `description` swapped.  Every drain discarded and recreated it, so it
  # never got validated and the knowledge never set.  The curator JUDGES
  # what is already written; it does not write.
  - "memory(mode:preload, tools:[retrieve_memories, update_memory, list_memory_tags])"

gc:
  type: hybrid
  threshold_percent: 75.0
  preserve_recent_turns: 4

plugin_configs:
  memory:
    # Same store as the scribe, and same reasoning — see _base_escriba.
    storage_path: .jaato/memory/escriba
    global_storage_path: .jaato/memory/escriba-global
    allowed_scopes: ["project"]
  permission:
    policy:
      defaultPolicy: deny
      whitelist:
        # WITHOUT `delete_memory`, and this is a guarantee, not a
        # preference.
        #
        # Incident 2026-09-09: on its first run the curator deleted three
        # of the user's real memories — two of them personal, with 22 and
        # 18 uses.  The persona DID say "prefer discarding to deleting";
        # prose is a suggestion and the whitelist is the contract, so the
        # contract won.
        #
        # Discarding does everything curation needs and is reversible: it
        # is a change of `maturity`, not a loss.  Deleting is not
        # recoverable — those three only came back because the session
        # journal happened to hold their full content, which is luck and
        # not design.
        tools: [retrieve_memories, update_memory, list_memory_tags]
